<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vælg land — Administration</title>
<meta name="robots" content="noindex, nofollow">
<style>
  /* Samme farvepalet som internal-country-admin.html/admin-login.html — se dem for begrundelsen. */
  :root {
    --paper: #12202a; --card: #16283355; --ink: #f0ede6; --ink-soft: #9fb0bb;
    --accent: #4fb8d6; --border: rgba(255,255,255,.08);
    --ok: #3fa96a; --warn: #d4a020; --bad: #d1584a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: linear-gradient(180deg, #0d1720, #12202a 40%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* NYT (cross-market admin-dashboard): udvidet fra 420px (kun landevælgeren)
     til samme bredde som stats.html/internal-country-admin.html, nu hvor
     siden også rummer dashboardets stat-grid/trend-grafer. */
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .sub { color: var(--ink-soft); font-size: .85rem; margin-bottom: 1.5rem; }
  /* RETTET (bruger-krav 2026-08-30 — "små knapper i toppen, ikke et stort
     panel med flag"): landevælgeren var oprindeligt tre store kort (flag +
     navn + produkt), der skubbede selve valget ned under en indledende
     overskrift. Erstattet med SAMME små pille-knapper i en .top-bar som
     internal-country-admin.html's egen #country-switcher — samme CSS,
     bevidst dupliceret her (samme etablerede mønster som resten af filen)
     fremfor en delt stylesheet. Ingen .active-tilstand her (i modsætning
     til country-admin-siden) — denne side har intet "nuværende land" at
     fremhæve, alle tre er ligestillede valg. */
  .top-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem; margin-bottom: .3rem; }
  .country-switcher { display: flex; gap: .4rem; }
  .country-switcher a {
    font-size: .78rem; color: var(--ink-soft); text-decoration: none; padding: .3rem .6rem;
    border-radius: 6px; border: 1px solid var(--border);
  }
  .country-switcher a:hover { color: var(--ink); background: rgba(255,255,255,.06); }
  #staff-identity { font-size: .8rem; color: var(--ink-soft); margin-top: 1.5rem; }
  #staff-identity a { color: var(--accent); }

  /* ── Cross-market dashboard (bruger-krav 2026-08-27) — SAMME stat-card-/
     trend-graf-CSS som stats.html (den offentlige side dette erstatter) og
     internal-country-admin.html — bevidst dupliceret her fremfor en delt
     CSS-fil, samme etablerede mønster som de øvrige internal-*.html-sider
     allerede følger for hinanden (kun JS-logikken er delt, se
     admin-dashboard.js). ────────────────────────────────────────── */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .card {
    background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.1rem 1.3rem;
  }
  .card h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 0 0 .6rem; font-weight: 600; }
  .stat { font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
  .stat-note { font-size: .78rem; color: var(--ink-soft); margin-top: .3rem; }
  .stat-controls { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .stat-controls label { font-size: .8rem; color: var(--ink-soft); }
  .stat-controls select {
    background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--ink);
    padding: .35rem .5rem; border-radius: 6px; font-size: .85rem; font-family: inherit; color-scheme: dark;
  }
  .stat-controls select option { background: var(--paper); color: var(--ink); }
  .err { color: var(--bad); font-size: .9rem; }
  .loading { color: var(--ink-soft); font-size: .9rem; }

  .trend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .trend-card h2 { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; }
  .trend-chart-wrap { position: relative; }
  .trend-chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .trend-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .trend-grad-stop-1 { stop-color: var(--accent); stop-opacity: .16; }
  .trend-grad-stop-2 { stop-color: var(--accent); stop-opacity: 0; }
  .trend-grid-line { stroke: rgba(255,255,255,.08); stroke-width: 1; shape-rendering: crispEdges; }
  .trend-axis-label { fill: var(--ink-soft); font-size: 9px; font-family: inherit; }
  .trend-end-dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
  .trend-end-label { fill: var(--ink); font-size: 10px; font-weight: 700; font-family: inherit; }
  .trend-crosshair { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 2 2; pointer-events: none; opacity: 0; }
  .trend-hover-dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; pointer-events: none; opacity: 0; }
  .trend-hit-layer { fill: transparent; cursor: crosshair; }
  .trend-tooltip {
    position: absolute; top: 0; left: 0; pointer-events: none; opacity: 0;
    background: #0d1720; border: 1px solid var(--border); border-radius: 6px;
    padding: .35rem .55rem; font-size: .72rem; white-space: nowrap; transform: translate(-50%, -115%);
    transition: opacity .1s;
  }
  .trend-tooltip .tt-date { color: var(--ink-soft); }
  .trend-tooltip .tt-value { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; margin-left: .4rem; }
  .trend-empty { color: var(--ink-soft); font-size: .8rem; padding: 1.5rem 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>🏛 Administration</h1>
    <div class="country-switcher">
      <a href="/internal/admin/DK">Danmark</a>
      <a href="/internal/admin/UK">United Kingdom</a>
      <a href="/internal/admin/FR">France</a>
    </div>
  </div>
  <div class="sub" id="staff-identity"></div>

  <h1 style="margin-top:2rem">📊 Alle markeder</h1>
  <div id="admin-dashboard-root"></div>
</div>

<script src="/admin-dashboard.js"></script>
<script>
// Samme "hvem er logget ind + log ud"-mønster som internal-country-admin.html.
async function loadStaffIdentity() {
  const el = document.getElementById('staff-identity');
  try {
    const resp = await fetch('/internal/api/me');
    if (!resp.ok) return;
    const staff = await resp.json();
    el.innerHTML = `Logget ind som ${staff.email} · <a href="#" onclick="logout(); return false;">Log ud</a>`;
  } catch (e) { /* stille fejl — kun en visuel bekvemmelighed */ }
}
async function logout() {
  await fetch('/internal/logout', { method: 'POST' });
  location.href = '/internal/login';
}
loadStaffIdentity();

initAdminDashboard({ containerId: 'admin-dashboard-root', country: 'ALL' });
</script>
</body>
</html>
