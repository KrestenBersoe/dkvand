<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sæt adgangskode</title>
<meta name="robots" content="noindex, nofollow">
<style>
  /* Samme farvepalet/tema som login.html/admin-login.html — se dem for begrundelsen. */
  :root {
    --paper: #12202a; --card: #16283355; --ink: #f0ede6; --ink-soft: #9fb0bb;
    --accent: #4fb8d6; --border: rgba(255,255,255,.08);
    --ok: #3fa96a; --warn: #d4a020; --bad: #d1584a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: linear-gradient(180deg, #0d1720, #12202a 40%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 420px; margin: 4rem auto 0; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .sub { color: var(--ink-soft); font-size: .85rem; margin-bottom: 1.5rem; }
  .card {
    background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.3rem 1.4rem;
  }
  label { display: block; font-size: .82rem; color: var(--ink-soft); margin: 0 0 .4rem; }
  input {
    width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--ink);
    padding: .6rem .7rem; border-radius: 8px; font-size: .95rem; font-family: inherit;
    margin-bottom: 1rem;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; background: var(--accent); border: none; color: #0d1720;
    padding: .65rem 1.2rem; border-radius: 8px; font-size: .9rem; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err-msg {
    background: rgba(209,88,74,.12); color: var(--bad); font-size: .85rem;
    padding: .7rem .9rem; border-radius: 8px; margin-bottom: 1rem; display: none;
  }
  .err-msg.show { display: block; }
  .ok-msg {
    background: rgba(63,169,106,.12); color: var(--ok); font-size: .85rem;
    padding: .7rem .9rem; border-radius: 8px; margin-bottom: 1rem; display: none;
  }
  .ok-msg.show { display: block; }
  .field-note { font-size: .74rem; color: var(--ink-soft); margin: -.6rem 0 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 Sæt adgangskode</h1>
  <div class="sub" id="subtitle">Indlæser…</div>

  <div class="card">
    <div class="err-msg" id="err-msg"></div>
    <div class="ok-msg" id="ok-msg"></div>
    <form id="form" onsubmit="return submitForm(event)">
      <label for="f-email">Login-e-mail</label>
      <input id="f-email" name="email" type="email" required autocomplete="username">
      <label for="f-password">Ny adgangskode</label>
      <input id="f-password" name="password" type="password" required autocomplete="new-password" minlength="8">
      <div class="field-note">Mindst 8 tegn. Erstatter en evt. tidligere sat adgangskode med det samme.</div>
      <button type="submit" id="submit-btn">Gem adgangskode</button>
    </form>
  </div>
</div>

<script>
// NYT (single login, selvbetjent) — se server.js's GET/POST /set-password
// for den fulde begrundelse for det injicerede JSON-objekts felter,
// herunder hvorfor `assertion` (kun sat for et UK council/FR mairie, aldrig
// en dansk kommune) skal genindsendes uændret med selve POST'en.
window.__SET_PASSWORD__ = %%SET_PASSWORD_JSON%%;

const ctx = window.__SET_PASSWORD__;
document.getElementById('subtitle').textContent = `${ctx.tenantName} — ` +
  (ctx.currentLoginEmail ? `login-e-mail sat til ${ctx.currentLoginEmail}.` : 'ingen adgangskode-login sat endnu.');
if (ctx.currentLoginEmail) document.getElementById('f-email').value = ctx.currentLoginEmail;

async function submitForm(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('err-msg');
  const okEl = document.getElementById('ok-msg');
  errEl.classList.remove('show');
  okEl.classList.remove('show');

  const loginEmail = document.getElementById('f-email').value.trim();
  const password = document.getElementById('f-password').value;

  btn.disabled = true;
  btn.textContent = 'Gemmer…';
  try {
    const resp = await fetch('/set-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ loginEmail, password, assertion: ctx.assertion }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      errEl.textContent = data.error || 'Kunne ikke gemme adgangskoden.';
      errEl.classList.add('show');
      return;
    }
    okEl.textContent = `Gemt. Du kan nu logge ind direkte på /login med ${loginEmail}.`;
    okEl.classList.add('show');
    document.getElementById('f-password').value = '';
  } catch (e) {
    errEl.textContent = 'Kunne ikke gemme adgangskoden — tjek din forbindelse.';
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Gem adgangskode';
  }
  return false;
}
</script>
</body>
</html>
