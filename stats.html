<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistik — Badevandsvarsel</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --paper: #12202a; --card: #16283355; --ink: #f0ede6; --ink-soft: #9fb0bb;
    --accent: #4fb8d6; --border: rgba(255,255,255,.08);
    --ok: #3fa96a; --warn: #d4a020; --bad: #d1584a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: linear-gradient(180deg, #0d1720, #12202a 40%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .sub { color: var(--ink-soft); font-size: .85rem; margin-bottom: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .card {
    background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.1rem 1.3rem;
  }
  .card h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 0 0 .6rem; font-weight: 600; }
  .stat { font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
  .stat-note { font-size: .78rem; color: var(--ink-soft); margin-top: .3rem; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: .4rem; }
  td { padding: .3rem 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; padding-left: .9rem; }
  tr + tr td { border-top: 1px solid var(--border); }
  .bar-row { display: flex; align-items: center; gap: .6rem; margin: .5rem 0; }
  .bar-label { width: 90px; font-size: .8rem; color: var(--ink-soft); flex-shrink: 0; }
  .bar-track { flex: 1; height: 8px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar-n { font-size: .8rem; font-variant-numeric: tabular-nums; width: 34px; text-align: right; flex-shrink: 0; }
  .err { color: var(--bad); font-size: .9rem; }
  .loading { color: var(--ink-soft); font-size: .9rem; }
  footer { color: var(--ink-soft); font-size: .72rem; text-align: center; margin-top: 2rem; }
  a { color: var(--accent); }

  /* ── Udviklingsgrafer (bruger-ønske 2026-08-10) ────────────────────────── */
  .trend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .trend-card h2 { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; }
  .trend-value { font-size: 1rem; font-weight: 700; color: var(--ink); text-transform: none; letter-spacing: normal; }
  .trend-chart-wrap { position: relative; }
  .trend-chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .trend-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .trend-grad-stop-1 { stop-color: var(--accent); stop-opacity: .16; }
  .trend-grad-stop-2 { stop-color: var(--accent); stop-opacity: 0; }
  .trend-grid-line { stroke: rgba(255,255,255,.08); stroke-width: 1; shape-rendering: crispEdges; }
  .trend-axis-label { fill: var(--ink-soft); font-size: 9px; font-family: inherit; }
  .trend-end-dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
  .trend-end-label { fill: var(--ink); font-size: 10px; font-weight: 700; font-family: inherit; }
  .trend-crosshair { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 2 2; pointer-events: none; opacity: 0; }
  .trend-hover-dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; pointer-events: none; opacity: 0; }
  .trend-hit-layer { fill: transparent; cursor: crosshair; }
  .trend-tooltip {
    position: absolute; top: 0; left: 0; pointer-events: none; opacity: 0;
    background: #0d1720; border: 1px solid var(--border); border-radius: 6px;
    padding: .35rem .55rem; font-size: .72rem; white-space: nowrap; transform: translate(-50%, -115%);
    transition: opacity .1s;
  }
  .trend-tooltip .tt-date { color: var(--ink-soft); }
  .trend-tooltip .tt-value { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; margin-left: .4rem; }
  .trend-empty { color: var(--ink-soft); font-size: .8rem; padding: 1.5rem 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 Statistik</h1>
  <div class="sub">Badevandsvarsel — installationer, push-adoption, indsendte vurderinger og udsendte push</div>

  <div id="content" class="loading">Indlæser…</div>

  <footer id="footer"></footer>
</div>

<script>
const PLATFORM_LABELS = { ios: 'iOS', android: 'Android', desktop: 'Desktop', other: 'Andet' };
const PUSH_TYPE_LABELS = {
  'risikovarsel':     'Risikovarsler',
  'heartbeat':        'Installations-heartbeat',
  'ugentlig-digest':  'Ugentlig badested-status',
  'ny-vurdering':     'Badestedsvurdering',
  'ukendt':           'Ukendt/ældre',
};

function pushTypeRows(byType) {
  if (!byType || byType.length === 0) return '<tr><td colspan="4" style="color:var(--ink-soft)">Ingen push sendt endnu</td></tr>';
  return byType.map(r => `
    <tr>
      <td>${PUSH_TYPE_LABELS[r.type] || r.type}</td>
      <td class="n">${r.last24h}</td>
      <td class="n">${r.last7d}</td>
      <td class="n">${r.total}</td>
    </tr>
  `).join('');
}

function platformRows(byPlatform) {
  const entries = Object.entries(byPlatform || {}).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...entries.map(([, n]) => n));
  if (entries.length === 0) return '<div class="stat-note">Ingen data endnu</div>';
  return entries.map(([platform, n]) => `
    <div class="bar-row">
      <div class="bar-label">${PLATFORM_LABELS[platform] || platform}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(100 * n / max)}%"></div></div>
      <div class="bar-n">${n}</div>
    </div>
  `).join('');
}

function pct(a, b) { return b > 0 ? Math.round(100 * a / b) : 0; }

// ── Udviklingsgrafer — se dataviz-metoden: linje 2px/rund cap, arealfyld
// ~10-16% opacitet, hårfine recessive gridlinjer, værdi mærket ved
// slutpunktet (ikke ved hvert punkt), og en crosshair+tooltip på hover
// som standard for linjediagrammer (ikke en valgfri ekstra). Hver graf er
// ÉN serie — ingen tegnforklaring nødvendig, kortets titel navngiver den
// allerede.
function fmtDateShort(d) {
  const [, m, day] = d.split('-');
  return `${day}/${m}`;
}
function fmtCount(n) { return Math.round(n).toLocaleString('da-DK'); }

let _trendChartSeq = 0;
function renderTrendChart(containerId, points, opts) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  if (points.length === 0) {
    wrap.innerHTML = '<div class="trend-empty">Ingen data endnu — første punkt gemmes i løbet af i dag</div>';
    return;
  }
  if (points.length === 1) {
    wrap.innerHTML = `<div class="trend-empty">${fmtCount(points[0].value)} (${fmtDateShort(points[0].date)}) — for lidt historik til en graf endnu</div>`;
    return;
  }

  const W = 600, H = 150;
  const padL = 4, padR = 46, padT = 10, padB = 20;
  const plotL = padL, plotR = W - padR, plotT = padT, plotB = H - padB;
  const plotW = plotR - plotL, plotH = plotB - plotT;

  const values = points.map(p => p.value);
  let vMin = Math.min(...values), vMax = Math.max(...values);
  if (vMin === vMax) { vMin = Math.max(0, vMin - 1); vMax = vMax + 1; } // undgå en flad 0-højde-linje ved en helt uændret værdi
  const yPad = (vMax - vMin) * 0.12;
  vMin = Math.max(0, vMin - yPad);
  vMax = vMax + yPad;

  const xAt = i => plotL + (plotW * i) / (points.length - 1);
  const yAt = v => plotB - ((v - vMin) / (vMax - vMin)) * plotH;

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${xAt(i).toFixed(1)},${yAt(p.value).toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L${xAt(points.length - 1).toFixed(1)},${plotB} L${xAt(0).toFixed(1)},${plotB} Z`;
  const last = points[points.length - 1];
  const gradId = `trendGrad${_trendChartSeq++}`;

  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label} over tid, seneste værdi ${fmtCount(last.value)}">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" class="trend-grad-stop-1"/>
          <stop offset="100%" class="trend-grad-stop-2"/>
        </linearGradient>
      </defs>
      <line class="trend-grid-line" x1="${plotL}" y1="${plotT}" x2="${plotR}" y2="${plotT}"/>
      <line class="trend-grid-line" x1="${plotL}" y1="${(plotT + plotB) / 2}" x2="${plotR}" y2="${(plotT + plotB) / 2}"/>
      <line class="trend-grid-line" x1="${plotL}" y1="${plotB}" x2="${plotR}" y2="${plotB}"/>
      <path fill="url(#${gradId})" d="${areaPath}"/>
      <path class="trend-line" d="${linePath}"/>
      <circle class="trend-end-dot" cx="${xAt(points.length - 1).toFixed(1)}" cy="${yAt(last.value).toFixed(1)}" r="5"/>
      <text class="trend-end-label" x="${(plotR + 8).toFixed(1)}" y="${yAt(last.value).toFixed(1)}" dominant-baseline="middle">${fmtCount(last.value)}</text>
      <text class="trend-axis-label" x="${plotL}" y="${H - 4}">${fmtDateShort(points[0].date)}</text>
      <text class="trend-axis-label" x="${plotR}" y="${H - 4}" text-anchor="end">${fmtDateShort(last.date)}</text>
      <line class="trend-crosshair" x1="0" y1="${plotT}" x2="0" y2="${plotB}"/>
      <circle class="trend-hover-dot" r="5"/>
      <rect class="trend-hit-layer" x="${plotL}" y="0" width="${plotW}" height="${H}"/>
    </svg>
    <div class="trend-tooltip"><span class="tt-date"></span><span class="tt-value"></span></div>
  `;

  const svgEl      = wrap.querySelector('svg');
  const hitLayer   = wrap.querySelector('.trend-hit-layer');
  const crosshair  = wrap.querySelector('.trend-crosshair');
  const hoverDot   = wrap.querySelector('.trend-hover-dot');
  const tooltip    = wrap.querySelector('.trend-tooltip');
  const ttDate     = tooltip.querySelector('.tt-date');
  const ttValue    = tooltip.querySelector('.tt-value');

  // NYT: crosshair'en finder X — læser peger-X relativt til SVG'ens
  // gengivne bredde (ikke viewBox-koordinater direkte, da SVG'en skaleres
  // responsivt via CSS width:100%), og snapper til nærmeste datapunkt, så
  // læseren aldrig skal ramme en 2px-linje præcist. Samme readout for
  // pointermove OG et enkelt tryk (touch), se interaction.md.
  function showAt(clientX) {
    const rect = svgEl.getBoundingClientRect();
    const svgX = ((clientX - rect.left) / rect.width) * W;
    let idx = Math.round(((svgX - plotL) / plotW) * (points.length - 1));
    idx = Math.max(0, Math.min(points.length - 1, idx));
    const p = points[idx];
    const px = xAt(idx), py = yAt(p.value);
    crosshair.setAttribute('x1', px); crosshair.setAttribute('x2', px);
    crosshair.style.opacity = '1';
    hoverDot.setAttribute('cx', px); hoverDot.setAttribute('cy', py);
    hoverDot.style.opacity = '1';
    tooltip.style.opacity = '1';
    tooltip.style.left = `${(px / W) * 100}%`;
    tooltip.style.top  = `${(py / H) * 100}%`;
    ttDate.textContent  = p.date;
    ttValue.textContent = fmtCount(p.value);
  }
  function hide() {
    crosshair.style.opacity = '0';
    hoverDot.style.opacity  = '0';
    tooltip.style.opacity   = '0';
  }
  hitLayer.addEventListener('pointermove', e => showAt(e.clientX));
  hitLayer.addEventListener('pointerdown', e => showAt(e.clientX));
  hitLayer.addEventListener('pointerleave', hide);
}

function renderAllTrendCharts(history) {
  const series = {
    installs:   history.map(h => ({ date: h.date, value: h.active_installs })),
    subs:       history.map(h => ({ date: h.date, value: h.push_subscriptions })),
    vurderinger:history.map(h => ({ date: h.date, value: h.vurderinger_total })),
    riskPush:   history.map(h => ({ date: h.date, value: h.risk_push_total })),
  };
  renderTrendChart('trend-installs',    series.installs,    { label: 'Aktive installationer' });
  renderTrendChart('trend-subs',        series.subs,        { label: 'Webpush-abonnenter' });
  renderTrendChart('trend-vurderinger', series.vurderinger, { label: 'Badestedsvurderinger i alt' });
  renderTrendChart('trend-riskpush',    series.riskPush,    { label: 'Webpush for risikovarsler i alt' });
}

async function loadStats() {
  const content = document.getElementById('content');
  try {
    const [res, historyRes] = await Promise.all([
      fetch('api/stats', { cache: 'no-store' }),
      fetch('api/stats/history', { cache: 'no-store' }),
    ]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const s = await res.json();
    // NYT: historik er sekundær — en fejl her må ALDRIG blokere resten af
    // siden, som allerede virkede fint før denne udvidelse. Falder til en
    // tom liste (viser "ingen data endnu" pr. graf), i stedet for at kaste
    // og miste hele sidens indhold for en enkelt ekstra rutes skyld.
    const history = historyRes.ok ? (await historyRes.json()).history : [];

    const pushPct = pct(s.installs.activePushEnabled, s.installs.activeTotal);

    content.className = '';
    content.innerHTML = `
      <div class="grid">
        <div class="card">
          <h2>Aktive installationer</h2>
          <div class="stat">${s.installs.activeTotal}</div>
          <div class="stat-note">Heartbeat inden for ${s.installs.activeWindowDays} dage · ${s.installs.everSeenTotal} set nogensinde</div>
        </div>
        <div class="card">
          <h2>Push-aktiveret</h2>
          <div class="stat">${pushPct}%</div>
          <div class="stat-note">${s.installs.activePushEnabled} af ${s.installs.activeTotal} aktive installationer</div>
        </div>
        <div class="card">
          <h2>Webpush-abonnenter</h2>
          <div class="stat">${s.pushSubscriptions}</div>
          <div class="stat-note">Aktive abonnementer i alt</div>
        </div>
        <div class="card">
          <h2>Borger-vurderinger indsendt</h2>
          <div class="stat">${s.vurderinger.total}</div>
          <div class="stat-note">${s.vurderinger.last7d} seneste 7 dage · ${s.vurderinger.last30d} seneste 30 dage</div>
        </div>
        <div class="card">
          <h2>Webpush sendt (total)</h2>
          <div class="stat">${s.pushSends.totals.total}</div>
          <div class="stat-note">${s.pushSends.totals.last24h} seneste 24 timer · ${s.pushSends.totals.last7d} seneste 7 dage</div>
        </div>
      </div>

      <h1 style="font-size:1rem;margin:0 0 .8rem">Udvikling over tid</h1>
      <div class="trend-grid">
        <div class="card trend-card">
          <h2>Aktive installationer</h2>
          <div class="trend-chart-wrap" id="trend-installs"></div>
        </div>
        <div class="card trend-card">
          <h2>Webpush-abonnenter</h2>
          <div class="trend-chart-wrap" id="trend-subs"></div>
        </div>
        <div class="card trend-card">
          <h2>Badestedsvurderinger i alt</h2>
          <div class="trend-chart-wrap" id="trend-vurderinger"></div>
        </div>
        <div class="card trend-card">
          <h2>Webpush for risikovarsler i alt</h2>
          <div class="trend-chart-wrap" id="trend-riskpush"></div>
        </div>
      </div>

      <div class="card" style="margin-bottom:1rem">
        <h2>Installationer pr. platform</h2>
        <div style="margin-bottom:.3rem;font-size:.72rem;color:var(--ink-soft)">Aktive (seneste ${s.installs.activeWindowDays} dage)</div>
        ${platformRows(s.installs.activeByPlatform)}
        <div style="margin:1rem 0 .3rem;font-size:.72rem;color:var(--ink-soft)">Set nogensinde</div>
        ${platformRows(s.installs.everSeenByPlatform)}
      </div>

      <div class="card">
        <h2>Webpush sendt pr. type</h2>
        <table>
          <thead><tr style="color:var(--ink-soft);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em">
            <td>Type</td><td class="n">24t</td><td class="n">7d</td><td class="n">Total</td>
          </tr></thead>
          <tbody>${pushTypeRows(s.pushSends.byType)}</tbody>
        </table>
      </div>
    `;
    renderAllTrendCharts(history);
    document.getElementById('footer').textContent = `Genereret ${new Date(s.generatedAt).toLocaleString('da-DK')}`;
  } catch (e) {
    content.className = 'err';
    content.textContent = `Kunne ikke hente statistik: ${e.message}`;
  }
}

loadStats();
</script>
</body>
</html>
