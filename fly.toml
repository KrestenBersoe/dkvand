app = 'dkvand'
primary_region = 'arn'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Sat til 1 (var 0): selvom volumen løser selve cache-persistens-problemet,
  # tilføjer volume-montering ved opstart (filsystem-tjek + mount) nok ekstra
  # tid til at Fly's proxy nogle gange giver op efter ~8,5 sek, før appen når
  # at blive klar — det viste sig som en "hængende" forbindelse for brugeren
  # ved kolde opstarter. Med min_machines_running=1 sker en kold opstart
  # aldrig for en rigtig bruger, kun ved deploy.
  min_machines_running = 1

[[mounts]]
  # Persistent lagring til .currents-cache.json — overlever autostop/start,
  # i modsætning til containerens rodfilsystem. Oprettes med:
  #   fly volumes create currents_cache --region arn --size 1
  #
  # HISTORIK (2026-08-01/02): appen kørte tidligere på 2 maskiner, hver med
  # sin egen, ikke-synkroniserede kopi af denne volume — app-metrics.db,
  # badested-observations.db OG push-subscriptions.json/push-queue.json lå
  # dengang alle her, så samme abonnent/bruger kunne ende med vidt
  # forskellige tal alt efter hvilken maskine Fly's proxy tilfældigt
  # routede til (opdaget som "stats bliver slettet ved genstart" — reelt
  # "forkert maskine", intet blev nogensinde slettet).
  #
  # LØST (2026-08-02): ALT det ovenstående er migreret til Fly Managed
  # Postgres (se db.js, app-metrics.js, badested-observations.js, samt
  # push_subscriptions/push_send_queue-tabellerne i server.js) —
  # netværkstilgængeligt fra alle maskiner. Det eneste, der stadig ligger
  # lokalt her, er .currents-cache.json — en ren, gratis-at-genskabe CACHE
  # (CMEMS-strømdata), IKKE kildedata. At den er per-maskine er derfor
  # harmløst (værste konsekvens: en maskine genhenter data en anden
  # maskine allerede har, ingen datainkonsistens for brugeren) — appen kan
  # nu SKALERES TIL FLERE MASKINER UDEN RESTRIKTIONEN OVENFOR.
  source      = "currents_cache"
  destination = "/data"

[[vm]]
  # Opdateret fra 256mb (var årsag til gentagne OOM-kills) til 2048mb,
  # matcher den værdi der reelt er sat via Fly-dashboardet. Denne fil
  # overskriver dashboard-indstillinger ved næste `fly deploy` hvis den
  # ikke holdes i sync — derfor rettet her også, ikke kun i UI'en.
  # Sat tilbage til 2048mb (2026-07-29, bruger-beslutning) — se cpu_kind
  # nedenfor: performance-kravet om minimum 4096 MiB bortfalder nu appen
  # er tilbage på 'shared'.
  memory = '2048mb'
  # Skiftet fra 'shared' til 'performance' (2026-07-25) — målt direkte via
  # /proc/stat på maskinen: op til ~1.359 CPU-sekunder "steal time" over 21
  # minutters oppetid (mere end selve idle-tiden!), og ~40% steal målt live
  # over 5 sekunder. Det er hypervisoren, der giver denne VM's tildelte
  # CPU-tid til ANDRE lejere på samme fysiske host under kontention — en
  # iboende egenskab ved delte vCPU'er, ikke noget der kan rettes i appens
  # egen kode. Forklarede periodiske badevand-risk-spikes (4,5s → 54,9s med
  # UÆNDRET data/kode) og generel langsomhed. Dedikerede vCPU'er er ikke
  # underlagt steal fra andre lejere.
  # Sat tilbage til 'shared' (2026-07-29, bruger-beslutning) — bevidst
  # accept af risikoen for CPU-steal beskrevet ovenfor, til fordel for
  # lavere omkostning. cpus=2 holdes uændret.
  cpu_kind = 'shared'
  # Opgraderet fra 1 til 2 (2026-07-25, manuel maskin-opgradering) — samme
  # drift-fælde som memory ovenfor: skal holdes i sync her, ellers
  # nedgraderer næste `fly deploy` maskinen tilbage til 1 vCPU.
  cpus = 2
