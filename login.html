<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log ind</title>
<meta name="robots" content="noindex, nofollow">
<style>
  /* Samme farvepalet/tema som admin-login.html/internal-login.html — se dem for begrundelsen. */
  :root {
    --paper: #12202a; --card: #16283355; --ink: #f0ede6; --ink-soft: #9fb0bb;
    --accent: #4fb8d6; --border: rgba(255,255,255,.08);
    --ok: #3fa96a; --warn: #d4a020; --bad: #d1584a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: linear-gradient(180deg, #0d1720, #12202a 40%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 420px; margin: 4rem auto 0; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .sub { color: var(--ink-soft); font-size: .85rem; margin-bottom: 1.5rem; }
  .card {
    background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.3rem 1.4rem;
  }
  label { display: block; font-size: .82rem; color: var(--ink-soft); margin: 0 0 .4rem; }
  input {
    width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--ink);
    padding: .6rem .7rem; border-radius: 8px; font-size: .95rem; font-family: inherit;
    margin-bottom: 1rem;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; background: var(--accent); border: none; color: #0d1720;
    padding: .65rem 1.2rem; border-radius: 8px; font-size: .9rem; font-weight: 700; cursor: pointer;
  }
  .err-msg {
    background: rgba(209,88,74,.12); color: var(--bad); font-size: .85rem;
    padding: .7rem .9rem; border-radius: 8px; margin-bottom: 1rem; display: none;
  }
  .err-msg.show { display: block; }
  .alt { margin-top: 1.2rem; font-size: .78rem; color: var(--ink-soft); text-align: center; }
  .alt a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="l-title">🔒 Log ind</h1>
  <div class="sub" id="l-sub">Ét login til hele platformen — kommune/council/mairie-adgang og internt driftspersonale.</div>

  <div class="card">
    <div class="err-msg" id="err-msg"></div>
    <form method="POST" action="/login">
      <input type="hidden" id="f-country" name="country" value="">
      <label for="f-email" id="l-email">E-mail</label>
      <input id="f-email" name="email" type="email" required autocomplete="username" autofocus>
      <label for="f-password" id="l-password">Adgangskode</label>
      <input id="f-password" name="password" type="password" required autocomplete="current-password">
      <button type="submit" id="l-submit">Log ind</button>
    </form>
    <!-- NYT: password er en TILVALGT tredje adgangsvej for en kommune/
         council/mairie (se tenant-admin.js's login_email/password_hash) —
         en konto uden password sat kan stadig kun bruge sit trial-link eller
         kommunens/council's/mairie's egen OAuth-udbyder, begge uændrede. -->
    <div class="alt" id="l-alt">Har du fået tilsendt et login-link i stedet? Brug det link direkte — det virker uafhængigt af denne side.</div>
  </div>
</div>

<script>
// Samme mønster som admin-login.html/internal-login.html — almindelig
// formular-POST, fejl vist via ?error= efter en 302 tilbage hertil.
const params = new URLSearchParams(location.search);
const error = params.get('error');
if (error) {
  const el = document.getElementById('err-msg');
  el.textContent = error;
  el.classList.add('show');
}

// NYT (bruger-krav 2026-08-27 — "Login siden på Engelsk og Fransk for de
// respektive lande"): ukwater's/frwater's egne GET /login redirecter hertil
// med ?country=UK/FR (se deres server/index.js) — DENNE side forbliver
// dansk som DEFAULT (dkvands egen direkte besøgte /login), men skifter
// synlig tekst til engelsk/fransk når parametren er sat. Ren klient-side
// tekst-udskiftning (samme "læs fra location.search"-mønster som ?error=
// ovenfor) — ingen server-side skabelon nødvendig, kun statisk tekst
// skifter, ikke rigtige backend-data (modsat internal-country-admin.html's
// %%COUNTRY_ADMIN_JSON%%-indsprøjtning). country videresendes som et skjult
// formular-felt, så POST /login kan lokalisere SINE fejlbeskeder til samme
// sprog (se server.js's LOGIN_TEXT).
const LOGIN_I18N = {
  en: {
    title: '🔒 Log in', sub: 'One login for the whole platform — council/municipality access and internal staff.',
    email: 'Email', password: 'Password', submit: 'Log in',
    alt: 'Received a login link instead? Use that link directly — it works independently of this page.',
  },
  fr: {
    title: '🔒 Connexion', sub: 'Une seule connexion pour toute la plateforme — accès mairie/commune et personnel interne.',
    email: 'E-mail', password: 'Mot de passe', submit: 'Se connecter',
    alt: 'Vous avez reçu un lien de connexion à la place ? Utilisez ce lien directement — il fonctionne indépendamment de cette page.',
  },
};
const countryParam = (params.get('country') || '').toUpperCase();
const lang = countryParam === 'UK' ? 'en' : countryParam === 'FR' ? 'fr' : null;
if (lang) {
  const t = LOGIN_I18N[lang];
  document.documentElement.lang = lang;
  document.title = t.title.replace(/^\S+\s/, '');
  document.getElementById('l-title').textContent = t.title;
  document.getElementById('l-sub').textContent = t.sub;
  document.getElementById('l-email').textContent = t.email;
  document.getElementById('l-password').textContent = t.password;
  document.getElementById('l-submit').textContent = t.submit;
  document.getElementById('l-alt').textContent = t.alt;
}
if (countryParam) document.getElementById('f-country').value = countryParam;
</script>
</body>
</html>
