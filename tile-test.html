<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tile test</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
<style>
  body { margin: 0; padding: 0; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  const map = new maplibregl.Map({
    container: 'map',
    style: '/map-assets/style.json',
    center: [12.57, 55.68], // Copenhagen
    zoom: 11,
  });
  map.addControl(new maplibregl.NavigationControl());

  map.on('load', () => {
    document.title = 'Tile test - loaded';
  });
  map.on('error', (e) => {
    console.error('MapLibre error:', e.error || e);
    document.title = 'Tile test - ERROR';
  });
</script>
</body>
</html>
