<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kommune-dashboard — Badevandsvarsel</title>
<meta name="robots" content="noindex, nofollow">
<!-- NYT (Kommune Dashboard-udvidelse, "Overløb"-fanen) — samme Leaflet-
     version (CDN, ikke vendoret) som dansk-overloeb-kort.html allerede
     bruger, til det nye live overløbskort. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* Samme farvepalet/tema som stats.html — se den for begrundelsen. */
  :root {
    --paper: #12202a; --card: #16283355; --ink: #f0ede6; --ink-soft: #9fb0bb;
    --accent: #4fb8d6; --border: rgba(255,255,255,.08);
    --ok: #3fa96a; --warn: #d4a020; --bad: #d1584a;
    /* RETTET (bruger-rapporteret — dropdown-menuer havde hvid baggrund,
       der skjulte lyse valgmuligheder): color-scheme fortæller browseren at
       bruge SIN EGEN mørke UA-styling for native kontroller (select-
       popup'en, month-pickeren osv.), som ellers ALTID falder tilbage til
       lys standard uanset vores egne background/color-regler nedenfor —
       dem arver den lukkede <select>, men IKKE selve options-listen. */
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: linear-gradient(180deg, #0d1720, #12202a 40%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  /* NYT (bruger-krav 2026-08-20 — "Log ud knappen flyttes øverst til højre
     i skærmbilledet"): fixed mod selve VIEWPORTET (ikke .wrap), så den
     forbliver synlig uanset scroll og fanevalg. */
  .dash-logout-fixed {
    position: fixed; top: 1rem; right: 1rem; z-index: 100;
    background: var(--card); border: 1px solid var(--border); color: var(--ink);
    border-radius: 6px; padding: .4rem .75rem; font-size: .78rem; cursor: pointer;
  }
  .dash-logout-fixed:hover { background: rgba(255,255,255,.06); }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .sub { color: var(--ink-soft); font-size: .85rem; margin-bottom: 1.5rem; }
  /* NYT (bruger-krav 2026-08-20 — "selve dashboard skal bruge dette
     logo"): hvid baggrundsplade (samme princip som skiltenes/PDF'ens
     logo-behandling — sikrer læsbarhed for ethvert logo, uanset dets egne
     farver, mod DETTE dashboards mørke tema). Størrelsesloft holder det
     visuelt underordnet selve titlen, ikke omvendt. */
  .dash-header { display: flex; align-items: center; gap: .9rem; margin-bottom: .3rem; }
  .dash-header h1 { margin: 0 0 .2rem; }
  .dash-logo {
    max-height: 3rem; max-width: 9rem; height: auto; width: auto;
    background: #fff; border-radius: .5rem; padding: .35rem .55rem;
    object-fit: contain; flex-shrink: 0;
  }

  /* NYT (bruger-ønske — indholdsfortegnelse): dashboardet fik med tiden
     flere kort end der er skærmhøjde til uden at scrolle (Status/Historik/
     Badested-statistik/Kommunalt Varsel/Statistik/Kommune-benchmark/
     Rapporter) — en simpel spring-liste øverst, ét link pr. kort. */
  .dash-toc { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
  .dash-toc a {
    color: var(--accent); background: rgba(255,255,255,.03); border: 1px solid var(--border);
    border-radius: 999px; padding: .3rem .8rem; font-size: .78rem; text-decoration: none;
  }
  .dash-toc a:hover { background: rgba(255,255,255,.07); }
  .card {
    background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.1rem 1.3rem; margin-bottom: 1rem;
  }
  .card h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 0 0 .6rem; font-weight: 600; }
  .row { display: flex; justify-content: space-between; padding: .3rem 0; font-size: .9rem; }
  .row + .row { border-top: 1px solid var(--border); }
  .row span:first-child { color: var(--ink-soft); }
  .badge { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .badge-trial { background: rgba(212,160,32,.18); color: var(--warn); }
  .badge-active { background: rgba(63,169,106,.18); color: var(--ok); }
  .badge-suspended { background: rgba(209,88,74,.18); color: var(--bad); }
  .placeholder-note {
    background: rgba(79,184,214,.08); border: 1px dashed var(--accent); border-radius: 10px;
    padding: .9rem 1.1rem; font-size: .82rem; color: var(--ink-soft);
  }
  button {
    background: transparent; border: 1px solid var(--border); color: var(--ink-soft);
    padding: .5rem 1rem; border-radius: 8px; font-size: .85rem; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--ink); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--border); color: var(--ink-soft); }
  .err { color: var(--bad); font-size: .9rem; }

  /* NYT (bruger-ønske 2026-08-15) — rapport-knapper (placeholder) */
  .report-buttons { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: .8rem; }

  /* NYT (Kommunepakke, modul 4) — badevandshistorik */
  .hist-controls { display: flex; align-items: center; gap: .6rem; margin-bottom: .9rem; }
  .hist-controls label { font-size: .82rem; color: var(--ink-soft); }
  .hist-controls input[type="month"] {
    background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--ink);
    padding: .35rem .5rem; border-radius: 6px; font-size: .85rem; font-family: inherit;
  }
  .hist-row { margin-bottom: .8rem; }
  .hist-row:last-child { margin-bottom: 0; }
  .hist-name { font-size: .86rem; margin-bottom: .3rem; }
  .hist-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: rgba(255,255,255,.06); }
  .hist-seg-green  { background: var(--ok); }
  .hist-seg-yellow { background: var(--warn); }
  .hist-seg-red    { background: var(--bad); }
  .hist-counts { font-size: .74rem; color: var(--ink-soft); margin-top: .3rem; }
  .hist-warning {
    background: rgba(212,160,32,.1); border: 1px solid rgba(212,160,32,.3); border-radius: 8px;
    padding: .7rem .9rem; font-size: .84rem; color: var(--warn);
  }
  .hist-empty { color: var(--ink-soft); font-size: .85rem; }

  /* NYT (Kommunepakke, modul 6) — badested-statistik */
  .stat-controls { display: flex; align-items: center; gap: .6rem; margin-bottom: .9rem; flex-wrap: wrap; }
  .stat-controls label { font-size: .82rem; color: var(--ink-soft); }
  .stat-controls select, .stat-controls input[type="month"] {
    background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--ink);
    padding: .35rem .5rem; border-radius: 6px; font-size: .85rem; font-family: inherit;
  }
  /* Ekstra, eksplicit fallback ud over :root's color-scheme ovenfor — nogle
     Chromium-udgaver respekterer stadig kun option-elementets EGEN
     background/color, ikke color-scheme alene, for selve popup-listen. */
  .stat-controls select option, .ov-field select option {
    background: var(--paper); color: var(--ink);
  }
  .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: .35rem 0; font-size: .86rem; cursor: pointer; }
  .stat-row + .stat-row { border-top: 1px solid var(--border); }
  .stat-row:hover .stat-name { text-decoration: underline; }
  .stat-name { flex: 1; }
  .stat-nums { color: var(--ink-soft); font-size: .78rem; white-space: nowrap; margin-left: .8rem; }
  .stat-empty { color: var(--ink-soft); font-size: .85rem; }

  /* NYT (bruger-ønske 2026-08-20) — historik-panelet (2 donuts) foldet ud
     under en badested-række i Badested-statistik, se toggleBadestedHistory()
     og buildRiskDonutSvg() i JS. Samme klassenavne/layout-logik som
     dansk-overloeb-kort.html's badevandspanel (mobil-først lodret, vandret
     side om side fra 721px), men egne farve-tokens (var(--ink) osv.) da
     DETTE dashboard er mørkt tema, i modsætning til det offentlige kort.
     ingenData-farven matcher OVL_BUCKET_COLOR['ingen-data'] (#1a6faf,
     blå) — IKKE dansk-overloeb-kort.html's gråtone, for at følge DETTE
     dashboards egen etablerede "ingen data"-farvekonvention. */
  .stat-detail { display: none; padding: .8rem 0 .4rem; border-top: 1px solid var(--border); }
  .stat-detail.open { display: block; }
  .bv-history-summary { display: flex; gap: 1rem; flex-wrap: wrap; }
  .bv-history-block { flex: 1; min-width: 130px; text-align: center; }
  .bv-history-block-title { font-size: .72rem; font-weight: 700; color: var(--ink-soft); margin-bottom: .5rem; }
  .bv-history-inner { display: flex; flex-direction: column; align-items: center; gap: .5rem; }
  .bv-history-legend { display: flex; flex-direction: column; gap: .25rem; color: var(--ink); font-size: .78rem; text-align: center; }
  @media (min-width: 721px) {
    .bv-history-inner { flex-direction: row; justify-content: center; gap: 1rem; }
    .bv-history-legend { text-align: left; align-items: flex-start; }
  }

  /* NYT (Kommunepakke, modul 6) — Kommunalt Varsel */
  .ov-intro { color: var(--ink-soft); font-size: .82rem; margin-bottom: .9rem; line-height: 1.4; }
  .ov-field { margin-bottom: .7rem; }
  .ov-field label { display: block; font-size: .8rem; color: var(--ink-soft); margin-bottom: .3rem; }
  .ov-field select, .ov-field textarea, .ov-field input {
    background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--ink);
    padding: .45rem .6rem; border-radius: 6px; font-size: .85rem; font-family: inherit; width: 100%;
  }
  .ov-duration { display: flex; align-items: flex-end; gap: .5rem; }
  .ov-duration input { width: 5rem; }
  .ov-duration select { flex: 1; }
  #ov-form button[type="submit"] { border-color: var(--accent); color: var(--ink); font-weight: 600; }
  .ov-ok { color: var(--ok); font-size: .84rem; margin-top: .6rem; }
  #ov-result .err { margin-top: .6rem; }
  .ov-active-row {
    background: rgba(212,160,32,.08); border: 1px solid rgba(212,160,32,.3); border-radius: 8px;
    padding: .7rem .9rem; margin-bottom: .7rem; font-size: .84rem;
  }
  .ov-active-msg { color: var(--ink-soft); margin: .3rem 0; }
  .ov-active-meta { color: var(--ink-soft); font-size: .74rem; margin-bottom: .5rem; }
  .ov-none { color: var(--ink-soft); font-size: .85rem; margin-bottom: 1rem; }

  /* NYT (Kommunepakke, modul 7) — kommune-scopet statistik, kopieret fra
     /stats' tilsvarende elementer (se stats.html) for samme visuelle sprog.
     Tal-kortene her er mindre/tættere end stats.html's egne (samme
     kompakte stil som resten af DETTE dashboard, .row/.stat-row ovenfor),
     men graf- og tabel-stilene er portet 1:1. */
  .kstat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .7rem; margin-bottom: 1rem; }
  .kstat-box { background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: 8px; padding: .7rem .8rem; }
  .kstat-box .kstat-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); margin-bottom: .35rem; }
  .kstat-box .kstat-value { font-size: 1.4rem; font-weight: 700; line-height: 1.1; }
  .kstat-box .kstat-note { font-size: .72rem; color: var(--ink-soft); margin-top: .25rem; }

  table.kstat-table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: .3rem; }
  table.kstat-table td { padding: .3rem 0; }
  table.kstat-table td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; padding-left: .9rem; }
  table.kstat-table tr + tr td { border-top: 1px solid var(--border); }

  /* NYT (bruger-ønske — kommune-benchmark-rapporten): egen kommune
     fremhævet i de rangerede lister, samme kstat-table-basis som ovenfor
     (genbruger td/n-stilene), kun tilføjer en synlig markering pr. række. */
  .kb-own-row td { background: rgba(255,255,255,.05); font-weight: 700; }
  .kb-subhead { font-size: .78rem; font-weight: 700; margin: 1.1rem 0 .15rem; color: var(--ink); }
  .kb-unit-note { font-size: .72rem; color: var(--ink-soft); margin-bottom: .3rem; }
  .kb-lav-n-list { font-size: .82rem; color: var(--ink-soft); }
  /* NYT (bruger-ønske 2026-08-18) — den fulde kommune-rangering foldes ud på
     klik, i stedet for altid at stå åben under Samlet placering-kortet. */
  .kb-details { margin-top: .9rem; }
  .kb-details summary {
    cursor: pointer; font-size: .82rem; color: var(--accent); list-style: none;
    display: inline-flex; align-items: center; gap: .35rem;
  }
  .kb-details summary::-webkit-details-marker { display: none; }
  .kb-details summary::before { content: '▸'; font-size: .7rem; transition: transform .15s; }
  .kb-details[open] summary::before { transform: rotate(90deg); }
  .kb-details .kb-unit-note { margin-top: .6rem; }
  #kb-custom-range input[type="date"] { margin-left: .4rem; }

  .trend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin: 1rem 0; }
  .trend-card { background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: 8px; padding: .7rem .8rem; }
  .trend-card h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 0 0 .4rem; font-weight: 600; display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; }
  .trend-chart-wrap { position: relative; }
  .trend-chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .trend-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .trend-grad-stop-1 { stop-color: var(--accent); stop-opacity: .16; }
  .trend-grad-stop-2 { stop-color: var(--accent); stop-opacity: 0; }
  .trend-grid-line { stroke: rgba(255,255,255,.08); stroke-width: 1; shape-rendering: crispEdges; }
  .trend-axis-label { fill: var(--ink-soft); font-size: 9px; font-family: inherit; }
  .trend-end-dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
  .trend-end-label { fill: var(--ink); font-size: 10px; font-weight: 700; font-family: inherit; }
  .trend-crosshair { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 2 2; pointer-events: none; opacity: 0; }
  .trend-hover-dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; pointer-events: none; opacity: 0; }
  .trend-hit-layer { fill: transparent; cursor: crosshair; }
  .trend-tooltip {
    position: absolute; top: 0; left: 0; pointer-events: none; opacity: 0;
    background: #0d1720; border: 1px solid var(--border); border-radius: 6px;
    padding: .35rem .55rem; font-size: .72rem; white-space: nowrap; transform: translate(-50%, -115%);
    transition: opacity .1s;
  }
  .trend-tooltip .tt-date { color: var(--ink-soft); }
  .trend-tooltip .tt-value { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; margin-left: .4rem; }
  .trend-empty { color: var(--ink-soft); font-size: .8rem; padding: 1.5rem 0; text-align: center; }

  /* NYT (bruger-ønske 2026-08-18) — borgervurderinger, kun læsning. Alger/
     affald ('flagget' i JS'en) skal skille sig tydeligt visuelt ud, da de
     kan udløse en besigtigelse — samme rav-toning som .badge-trial ovenfor,
     men på hele rækken, ikke kun et lille badge. */
  .vurd-list { display: flex; flex-direction: column; gap: .5rem; }
  .vurd-row {
    border: 1px solid var(--border); border-radius: 8px; padding: .6rem .8rem;
    background: rgba(255,255,255,.02);
  }
  .vurd-row.vurd-flagged { border-color: rgba(212,160,32,.4); background: rgba(212,160,32,.07); }
  .vurd-row-top { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .vurd-badested { font-weight: 600; font-size: .88rem; }
  .vurd-badested a { color: var(--ink); text-decoration: none; }
  .vurd-badested a:hover { text-decoration: underline; }
  .vurd-time { color: var(--ink-soft); font-size: .74rem; white-space: nowrap; }
  .vurd-types { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
  .vurd-type-badge {
    display: inline-flex; align-items: center; gap: .3rem; padding: .12rem .5rem;
    border-radius: 999px; font-size: .74rem; background: rgba(255,255,255,.05);
  }
  .vurd-flag-note { color: var(--warn); font-size: .74rem; margin-top: .4rem; }
  .vurd-photo-link { display: inline-block; margin-top: .5rem; font-size: .78rem; color: var(--accent); }
  .vurd-photo-link img { display: block; max-width: 220px; max-height: 220px; border-radius: 6px; margin-top: .3rem; }
  .vurd-empty { color: var(--ink-soft); font-size: .85rem; }
  .vurd-pager { display: flex; align-items: center; justify-content: center; gap: .8rem; margin-top: .8rem; }
  .vurd-pager button { font-size: .78rem; padding: .3rem .7rem; }
  .vurd-pager-note { color: var(--ink-soft); font-size: .78rem; white-space: nowrap; }

  /* NYT (bruger-ønske 2026-08-19) — to-fane-struktur (Overløb/Badevand).
     Portet mønster fra dansk-overloeb-kort.html's switchTab() (.tab-panel/
     .tab-btn + map.invalidateSize() ved fane-skift), tilpasset denne sides
     kort-baserede visuelle sprog i stedet for genbrugt 1:1. */
  .tab-bar { display: flex; gap: .5rem; margin-bottom: 1.2rem; }
  .tab-btn {
    flex: 1; background: rgba(255,255,255,.03); border: 1px solid var(--border); color: var(--ink-soft);
    padding: .6rem 1rem; border-radius: 10px; font-size: .92rem; font-weight: 600; cursor: pointer;
  }
  .tab-btn.active { background: rgba(79,184,214,.14); border-color: var(--accent); color: var(--ink); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* NYT — "Overløb"-fanen. Præfiks "ovl-" (ikke "ov-") bevidst valgt for at
     UNDGÅ kollision med det eksisterende "ov-" præfiks (ov-field/ov-intro/
     ov-active-row m.fl.), som allerede betyder "override" (Kommunalt
     Varsel-kortet) andetsteds i denne fil. 3-total-baren er en klon af
     dansk-overloeb-kort.html's .national-summary/.ns-red/.ns-yellow/
     .ns-green-farver (samme hex). */
  .ovl-totals { display: flex; gap: .6rem; margin-bottom: .5rem; }
  .ovl-total { flex: 1; text-align: center; border-radius: 10px; padding: .7rem .5rem; border: 1px solid var(--border); background: rgba(255,255,255,.02); }
  .ovl-total-value { display: block; font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
  .ovl-total-label { display: block; font-size: .7rem; color: var(--ink-soft); margin-top: .25rem; text-transform: uppercase; letter-spacing: .05em; }
  .ovl-total-red    .ovl-total-value { color: #e2694f; }
  .ovl-total-yellow .ovl-total-value { color: #d4a020; }
  .ovl-total-green  .ovl-total-value { color: #4fbf7f; }
  .ovl-nodata-note { font-size: .74rem; color: var(--ink-soft); margin-bottom: .6rem; min-height: 1em; }

  .ovl-horizon-toggle { display: inline-flex; gap: .3rem; }
  .ovl-horizon-btn { padding: .3rem .8rem; font-size: .8rem; }
  .ovl-horizon-btn.active { background: rgba(79,184,214,.15); border-color: var(--accent); color: var(--ink); }

  .ovl-map { height: 380px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); margin-top: .7rem; background: #0d1720; }
  .ovl-map-legend { display: flex; flex-wrap: wrap; gap: .9rem; margin-top: .6rem; font-size: .74rem; color: var(--ink-soft); align-items: center; }
  .ovl-legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: .35rem; vertical-align: middle; }
  .ovl-legend-ring { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px dashed #d4a020; margin-right: .35rem; vertical-align: middle; }

  /* Udløbs-alarmlisten — samme farvesprog som .alarm-card/.chip i dansk-
     overloeb-kort.html's Varsler-fane (venstrekant + chip), egne klassenavne
     for ikke at kollidere med den fil (separat side/kontekst). */
  .ovl-alert-row { border-left: 3px solid var(--border); border-radius: 6px; padding: .5rem .7rem; margin-bottom: .5rem; background: rgba(255,255,255,.02); font-size: .86rem; }
  .ovl-alert-row.risk-roed { border-left-color: #c84b1f; }
  .ovl-alert-row.risk-gul  { border-left-color: #d4a020; }
  .ovl-alert-top { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .ovl-alert-name { font-weight: 600; }
  .ovl-alert-chip { font-size: .74rem; padding: .1rem .55rem; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .ovl-alert-chip.risk-roed { background: rgba(200,75,31,.18); color: #e2694f; }
  .ovl-alert-chip.risk-gul  { background: rgba(212,160,32,.18); color: #d4a020; }
  .ovl-alert-meta { color: var(--ink-soft); font-size: .76rem; margin-top: .25rem; }
  .ovl-alert-empty { color: var(--ink-soft); font-size: .85rem; }

  /* NYT — generisk to-knaps-toggle (prioriteret listes sortering), samme
     visuelle stil som .ovl-horizon-toggle/.ovl-horizon-btn men et separat
     navn, da de to togglere styrer forskellige ting. */
  .ovl-toggle { display: inline-flex; gap: .3rem; margin: .5rem 0 .8rem; }
  .ovl-toggle-btn { padding: .3rem .8rem; font-size: .8rem; }
  .ovl-toggle-btn.active { background: rgba(79,184,214,.15); border-color: var(--accent); color: var(--ink); }
  .ovl-prio-note { font-size: .72rem; color: var(--ink-soft); margin-top: .6rem; line-height: 1.4; }

  /* NYT — "Indlejr kort"-kortets link-visning, samme readonly-tekstfelt +
     kopiér-mønster som andre steder i appen (fx sales-portalens login-link). */
  .ovl-embed-box { margin-top: .8rem; }
  .ovl-embed-box textarea {
    width: 100%; min-height: 4.2rem; background: rgba(255,255,255,.04); border: 1px solid var(--border);
    color: var(--ink); border-radius: 6px; padding: .5rem .6rem; font-size: .78rem; font-family: monospace; resize: vertical;
  }
  .ovl-embed-box .copy-note { font-size: .74rem; color: var(--ok); margin-top: .3rem; min-height: 1em; }

  /* RETTET — fuldskærm: fuldskærms-MÅLET er nu #ovl-map-fs-wrap (se HTML-
     kommentaren ved den), ikke #ovl-map selv, så #ovl-udlob-panel (en
     søskende til #ovl-map, begge efterkommere af wrapperen) er en del af
     samme fuldskærms-"top layer" og kan vises ovenpå kortet. */
  .ovl-map-fs-wrap:fullscreen,
  .ovl-map-fs-wrap:-webkit-full-screen {
    height: 100vh; display: flex;
  }
  .ovl-map-fs-wrap:fullscreen #ovl-map,
  .ovl-map-fs-wrap:-webkit-full-screen #ovl-map {
    flex: 1; height: 100%;
  }

  /* NYT (bruger-ønske 2026-08-19) — kortvælger-flyout, samme mønster som
     dkvand's #lag-btn/#lag-body men egne id'er/klasser. */
  .ovl-lag-wrap { position: relative; }
  .ovl-lag-body {
    display: none; position: absolute; top: 100%; left: 0; margin-top: .3rem;
    background: var(--paper); border: 1px solid var(--border); border-radius: 8px;
    padding: .5rem;
    /* RETTET (bruger-rapporteret — "kortlag vælger virker ikke"): var
       z-index:10 — Leaflet's egne panes (#ovl-map's tile-/marker-/tooltip-
       lag) ligger på z-index 200-700, OG .leaflet-container etablerer IKKE
       selv en ny stacking context (kun position:relative, intet z-index) —
       de to konkurrerer derfor direkte i samme forælder-stacking-context.
       Panelet blev dermed tegnet (og modtog klik) BAG kortet, usynligt for
       brugeren, selvom .open-klassen blev sat korrekt. */
    z-index: 1000; flex-direction: column; gap: .3rem; min-width: 180px;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }
  .ovl-lag-body.open { display: flex; }
  .ovl-layer-btn { text-align: left; font-size: .8rem; }
  .ovl-layer-btn.active { border-color: var(--accent); color: var(--ink); background: rgba(79,184,214,.12); }

  /* NYT — udløbs-detaljepanel: fast bundpanel, samme "mørk overlay bag et
     opslået ark"-mønster som showUdlobPanel() i dansk-overloeb-kort.html,
     men simplere/genimplementeret (egen fil, egen kontekst). */
  .ovl-panel-overlay {
    display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.55);
    align-items: flex-end; justify-content: center;
  }
  .ovl-panel-overlay.open { display: flex; }
  .ovl-panel-sheet {
    background: var(--paper); border-top: 1px solid var(--border); border-radius: 14px 14px 0 0;
    max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 1.1rem 1.3rem 1.6rem;
  }
  .ovl-panel-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem; margin-bottom: .6rem; }
  .ovl-panel-title { font-size: 1.05rem; font-weight: 700; }
  .ovl-panel-sub { color: var(--ink-soft); font-size: .8rem; margin-top: .15rem; }
  .ovl-panel-close { background: transparent; border: none; color: var(--ink-soft); font-size: 1.3rem; cursor: pointer; line-height: 1; padding: .2rem .4rem; }
  .ovl-panel-bars { display: flex; flex-direction: column; gap: .5rem; margin: .8rem 0; }
  .ovl-panel-bar-row { display: flex; align-items: center; gap: .6rem; font-size: .8rem; }
  .ovl-panel-bar-label { flex: 0 0 5.2rem; color: var(--ink-soft); }
  .ovl-panel-bar-track { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; }
  .ovl-panel-bar-fill { display: block; height: 100%; border-radius: 4px; }
  .ovl-panel-bar-pct { flex: 0 0 3rem; text-align: right; font-variant-numeric: tabular-nums; }
  .ovl-panel-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0; }
  .ovl-panel-stamdata { font-size: .82rem; line-height: 1.8; margin: .8rem 0; }
  /* NYT (bruger-krav 2026-08-20) — "Fuld PULS-stamdata"-udfoldning i
     udløbs-detaljepanelet, se ovlFullPulsDataHtml(). */
  .ovl-panel-full-data { margin: .6rem 0; }
  .ovl-panel-full-data summary {
    cursor: pointer; font-size: .8rem; font-weight: 600; color: var(--ink-soft);
    padding: .3rem 0;
  }
  .ovl-panel-full-data summary:hover { color: var(--ink); }
  .ovl-panel-full-data[open] summary { color: var(--ink); }
  .ovl-panel-full-data .ovl-panel-stamdata { margin-top: .3rem; }
  /* NYT (bruger-krav 2026-08-20 — "de data om det enkelte overløb som er
     tilgængelige i dkvand for brugerne skal også være tilgængelige i
     kommunalt dashboard"): udløbslisten i badested-klikpanelet, samme
     visuelle mønster (farvet prik + navn + afstand + risiko%) som det
     offentlige site's #bv-outlets, tema-tilpasset til dette mørke
     dashboard. */
  .bv-outlet-row { display: flex; align-items: center; gap: .6rem; padding: .45rem 0; border-bottom: 1px solid var(--border); }
  .bv-outlet-row:last-child { border-bottom: none; }
  .bv-outlet-name { font-size: .82rem; font-weight: 600; }
  .bv-outlet-sub { font-size: .7rem; color: var(--ink-soft); }
  .ovl-panel-stamdata a { color: var(--accent); }
  .ovl-panel-rain-title { font-size: .72rem; color: var(--ink-soft); margin: .8rem 0 .3rem; text-transform: uppercase; letter-spacing: .05em; }

  /* NYT — .ovl-alert-chip havde kun risk-roed/risk-gul defineret (den
     eksisterende varselsliste viser aldrig grøn/ingen-data der) — panelets
     viral/alge-chips kan ramme alle fire buckets. */
  .ovl-alert-chip.risk-groen { background: rgba(45,125,79,.18); color: #4fbf7f; }
  .ovl-alert-chip.risk-ingen-data { background: rgba(26,111,175,.18); color: #6fa8d6; }

  /* NYT (bruger-ønske 2026-08-19) — "Skilte"-fanen: <a>-download-knap med
     samme visuelle stil som almindelige <button>-elementer i denne fil
     (button {} ovenfor gælder kun selve button-tagget, ikke <a>). */
  .btn-link {
    display: inline-block; background: transparent; border: 1px solid var(--accent); color: var(--ink);
    padding: .5rem 1rem; border-radius: 8px; font-size: .85rem; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .btn-link:hover { background: rgba(79,184,214,.1); }
  .skilte-row {
    display: flex; align-items: center; justify-content: space-between; gap: .8rem;
    padding: .5rem 0; font-size: .86rem; border-top: 1px solid var(--border);
  }
  .skilte-row:first-child { border-top: none; }
  .skilte-row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skilte-row a.btn-link, .skilte-row button { font-size: .76rem; padding: .3rem .7rem; flex-shrink: 0; }
  .skilte-embed-box { margin-top: .5rem; }
  .skilte-embed-box textarea {
    width: 100%; min-height: 3.6rem; background: rgba(255,255,255,.04); border: 1px solid var(--border);
    color: var(--ink); border-radius: 6px; padding: .5rem .6rem; font-size: .74rem; font-family: monospace; resize: vertical;
  }
</style>
</head>
<body>
<button type="button" class="dash-logout-fixed" onclick="logout()">Log ud</button>
<div class="wrap">
  <div id="content">Indlæser…</div>
</div>

<script>
// NYT (Kommunepakke, modul 1): server.js's GET /admin/dashboard injicerer
// tenant-data HER (server-side streng-erstatning af pladsholderen
// nedenfor, se dens route-handler) — siden er allerede bag
// requireTenantSession, så dette script kører kun for en gyldig,
// autoriseret session. Ingen efterfølgende fetch nødvendig for selve
// tenant-identiteten (i modsætning til stats.html's api/stats-mønster) —
// men et separat, senere modul der tilføjer RIGTIGT dashboard-indhold
// (historik/rapporter/analyser) vil naturligt hente det via egne
// /admin/api/*-ruter, samme mønster som stats.html.
//
// RETTET (bruger-rapporteret 2026-08-14 — dashboardet hang permanent på
// "Indlæser…"): denne kommentar indeholdt TIDLIGERE selve pladsholder-
// strengen i klartekst. server.js's .replace() erstatter kun FØRSTE
// forekomst af en streng-søgning (ikke en global/regex-erstatning) — den
// ramte derfor denne kommentar, ikke linjen nedenfor, som forblev
// bogstavelig ugyldig JS og crashede HELE scriptet ved parse-tidspunktet.
// Pladsholderen må derfor ALDRIG optræde i klartekst andetsteds i denne
// fil end netop ÉN gang, på linjen nedenfor.
window.__TENANT__ = %%TENANT_JSON%%;

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function statusBadge(status) {
  const cls = status === 'active' ? 'badge-active' : status === 'suspended' ? 'badge-suspended' : 'badge-trial';
  const label = status === 'active' ? 'Aktiv' : status === 'suspended' ? 'Suspenderet' : 'Trial';
  return `<span class="badge ${cls}">${label}</span>`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('da-DK', { year: 'numeric', month: 'long', day: 'numeric' });
}

function currentMonthStr() {
  return new Date().toISOString().slice(0, 7); // 'YYYY-MM', UTC — samme konvention som backend'ens badevand_daily_risk
}

function render() {
  const t = window.__TENANT__;
  const content = document.getElementById('content');
  if (!t) {
    content.innerHTML = '<div class="err">Ikke logget ind, eller sessionen er udløbet.</div>';
    return;
  }
  content.innerHTML = `
    <div class="dash-header">
      ${t.logoUrl ? `<img class="dash-logo" src="${escHtml(t.logoUrl)}" alt="" onerror="this.remove()">` : ''}
      <div>
        <h1>🏛 ${escHtml(t.name)}</h1>
        <div class="sub">Kommune-dashboard — logget ind via ${t.authMethod === 'trial' ? 'trial-adgang' : 'kommunens eget OAuth-login'}</div>
      </div>
    </div>

    <!-- NYT (bruger-ønske 2026-08-19) — to faner: "Overløb" (drifts-
         dashboard, default-aktiv) og "Badevand" (al tidligere eksisterende
         rapportering, flyttet uændret ind i sit eget tab-panel nedenfor). -->
    <div class="tab-bar">
      <button type="button" class="tab-btn active" data-tab="overloeb" onclick="switchDashTab('overloeb')">Overløb</button>
      <button type="button" class="tab-btn" data-tab="badevand" onclick="switchDashTab('badevand')">Badevand</button>
      <button type="button" class="tab-btn" data-tab="skilte" onclick="switchDashTab('skilte')">Skilte</button>
      <button type="button" class="tab-btn" data-tab="opsaetning" onclick="switchDashTab('opsaetning')">Opsætning</button>
    </div>

    <div class="tab-panel active" id="tab-overloeb">
      <div class="card" id="card-overloeb-map">
        <h2>Overløb lige nu</h2>
        <div class="ovl-totals">
          <div class="ovl-total ovl-total-red"><span class="ovl-total-value" id="ovl-t-roed">–</span><span class="ovl-total-label">Røde overløb</span></div>
          <div class="ovl-total ovl-total-yellow"><span class="ovl-total-value" id="ovl-t-gul">–</span><span class="ovl-total-label">Gule overløb</span></div>
          <div class="ovl-total ovl-total-green"><span class="ovl-total-value" id="ovl-t-groen">–</span><span class="ovl-total-label">Grønne overløb</span></div>
        </div>
        <div class="ovl-nodata-note" id="ovl-nodata-note"></div>

        <div class="stat-controls">
          <label>Prognose</label>
          <div class="ovl-horizon-toggle" id="ovl-horizon-toggle">
            <button type="button" class="ovl-horizon-btn active" data-horizon="nu" onclick="setOverloebHorizon('nu')">Nu</button>
            <button type="button" class="ovl-horizon-btn" data-horizon="24h" onclick="setOverloebHorizon('24h')">24h</button>
            <button type="button" class="ovl-horizon-btn" data-horizon="72h" onclick="setOverloebHorizon('72h')">72h</button>
          </div>
          <!-- NYT (bruger-ønske 2026-08-19) — kortvælger, samme mønster som
               dkvand's #lag-btn/#lag-body, kun de lag kommune-kortet har
               data for (se planens afgrænsning). -->
          <div class="ovl-lag-wrap">
            <button type="button" onclick="toggleOvlLagPanel()">🗺️ Lag</button>
            <div id="ovl-lag-body" class="ovl-lag-body">
              <button type="button" class="ovl-layer-btn active" id="ovl-layerbtn-badesteder" onclick="toggleOvlLayer('badesteder')">🏖 Badesteder</button>
              <button type="button" class="ovl-layer-btn active" id="ovl-layerbtn-udloeb" onclick="toggleOvlLayer('udloeb')">📍 Udløbspunkter</button>
              <button type="button" class="ovl-layer-btn active" id="ovl-layerbtn-ringe" onclick="toggleOvlLayer('ringe')">⚠ Varselsringe</button>
              <button type="button" class="ovl-layer-btn" id="ovl-layerbtn-rbuRegn" onclick="toggleOvlLayer('rbuRegn')">🔴 RBU Regn</button>
              <button type="button" class="ovl-layer-btn" id="ovl-layerbtn-rbuKloak" onclick="toggleOvlLayer('rbuKloak')">🟤 RBU Kloak</button>
            </div>
          </div>
          <button type="button" onclick="toggleOvlFullscreen()" style="margin-left:auto">⛶ Fuld skærm</button>
        </div>

        <!-- RETTET (bruger-rapporteret — detaljepanelet åbnede "under
             kortet" i fuldskærm): Fullscreen API'ens "top layer" viser KUN
             det element der selv blev gjort fuldskærm, plus dets EGNE
             efterkommere — noget udenfor det (heller ikke en søskende med
             høj z-index) kan tegnes ovenpå. #ovl-udlob-panel lå tidligere
             som søskende til #ovl-map (uden for det), og forsvandt derfor
             visuelt bag kortet, så snart kortet selv gik i fuldskærm.
             #ovl-map-fs-wrap ombryder nu BEGGE, og er selve elementet der
             gøres fuldskærm (se toggleOvlFullscreen()) — panelet er dermed
             en efterkommer af fuldskærms-elementet og vises korrekt ovenpå. -->
        <div id="ovl-map-fs-wrap" class="ovl-map-fs-wrap">
          <div id="ovl-map" class="ovl-map"></div>
          <div class="ovl-panel-overlay" id="ovl-udlob-panel" onclick="if (event.target === this) closeOvlUdlobPanel()">
            <div class="ovl-panel-sheet" id="ovl-panel-sheet"></div>
          </div>
        </div>
        <div class="ovl-map-legend">
          <span><span class="ovl-legend-dot" style="background:#2d7d4f"></span>Grøn</span>
          <span><span class="ovl-legend-dot" style="background:#d4a020"></span>Gul</span>
          <span><span class="ovl-legend-dot" style="background:#c84b1f"></span>Rød</span>
          <span><span class="ovl-legend-ring"></span>Aktiv varselsring (udløb)</span>
        </div>
      </div>

      <div class="card" id="card-overloeb-varsler">
        <h2>Udløb med aktive varsler</h2>
        <div id="ovl-varsler-content">Indlæser…</div>
      </div>

      <div class="card" id="card-overloeb-historik">
        <h2>Historik — overløbsvarsler</h2>
        <div class="ov-intro">Antal nye gul/rød-varsler pr. dag i kommunen, seneste 90 dage.</div>
        <div class="trend-chart-wrap" id="ovl-historik-chart">Indlæser…</div>
      </div>

      <div class="card" id="card-overloeb-prioriteret">
        <h2>Prioriterede overløb</h2>
        <div class="stat-controls">
          <label for="ovl-prio-period">Periode</label>
          <select id="ovl-prio-period" onchange="onOvlPrioPeriodChange()">
            <option value="today">I dag</option>
            <option value="7d">Sidste 7 dage</option>
            <option value="month">Måned</option>
            <option value="quarter" selected>Sidste kvartal</option>
            <option value="year">Sidste år</option>
          </select>
          <input type="month" id="ovl-prio-month" value="${currentMonthStr()}" onchange="loadOverloebPrioriteret()" style="display:none">
        </div>
        <div class="ovl-toggle" id="ovl-prio-sort-toggle">
          <button type="button" class="ovl-toggle-btn active" data-sort="varsler" onclick="setOvlPrioSort('varsler')">Flest varsler</button>
          <button type="button" class="ovl-toggle-btn" data-sort="udledning" onclick="setOvlPrioSort('udledning')">Størst estimeret udledning</button>
        </div>
        <div id="ovl-prio-content">Indlæser…</div>
        <div class="ovl-prio-note">Estimeret udledning er baseret på PULS' gennemsnitlige udledningsmængde pr. hændelse × antal registrerede varsler i perioden — IKKE en målt mængde.</div>
      </div>

      <div class="card" id="card-overloeb-embed">
        <h2>Indlejr kort</h2>
        <div class="ov-intro">Vis kortet på jeres egen hjemmeside via en iframe — opdaterer sig selv live, samme data som ovenfor.</div>
        <button type="button" onclick="generateOverloebEmbed()">🔗 Generér indlejrings-link</button>
        <button type="button" onclick="revokeOverloebEmbeds()">Tilbagekald alle indlejrings-links</button>
        <div id="ovl-embed-result"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-badevand">
    <nav class="dash-toc">
      <a href="#card-status">Status</a>
      <a href="#card-badevandssteder">Badevandssteder</a>
      <a href="#card-varsel">Kommunalt Varsel</a>
      <a href="#card-statistik">Statistik</a>
      <a href="#card-vurderinger">Borgerindberetninger</a>
      <a href="#card-benchmark">Kommune-benchmark</a>
    </nav>

    <div class="card" id="card-status">
      <h2>Status</h2>
      <div class="row"><span>Status</span><span>${statusBadge(t.status)}</span></div>
      ${t.status === 'trial' ? `<div class="row"><span>Trial udløber</span><span>${fmtDate(t.trialExpiresAt)}</span></div>` : ''}
      ${t.agreementSignedAt ? `<div class="row"><span>Aftale underskrevet</span><span>${fmtDate(t.agreementSignedAt)}</span></div>` : ''}
    </div>

    <!-- RETTET (bruger-krav 2026-08-20 — "fusionér panelerne Badevandshistorik
         og badested-statistik til et samlet panel med navnet Badevandssteder"):
         de to kort er slået sammen til ét. Periode-vælgeren styrer fortsat
         varsel-/abonnenttallene (uændret fra badested-statistik), månedsvælgeren
         (tidligere Badevandshistoriks egen, separate kalendermåneds-bjælke pr.
         badested) er flyttet IND i hver rækkes fold-ud (se
         toggleBadestedHistory()) som en tredje sektion ved siden af de
         eksisterende "Sidste 7/30 dage"-donuts, i stedet for en separat,
         altid-synlig liste for ALLE badesteder på én gang. -->
    <div class="card" id="card-badevandssteder">
      <h2>Badevandssteder</h2>
      <div class="stat-controls">
        <label for="stat-period">Periode</label>
        <!-- RETTET (bruger-krav 2026-08-20 — standardiseret periode-vælger
             på tværs af Badevandssteder/Kommune-benchmark): Dag/Uge/Måned/
             Kvartal/År/Brugerdefineret. Værdierne (today/7d/quarter/year)
             er UÆNDREDE — kun de danske labels er opdateret — for ikke at
             skulle røre server.js's VALID_ALERT_PERIODS/
             computeAlertStatsRange(). Brugerdefineret er NY her (fandtes
             kun i Kommune-benchmark før), se stat-custom-range/
             onStatPeriodChange() og server.js's ?from=&to=-udvidelse af
             GET /admin/api/badested-alert-stats. -->
        <select id="stat-period" onchange="onStatPeriodChange()">
          <option value="today">Dag</option>
          <option value="7d">Uge</option>
          <option value="month">Måned</option>
          <option value="quarter">Kvartal</option>
          <option value="year">År</option>
          <option value="custom">Brugerdefineret</option>
        </select>
        <input type="month" id="stat-month" value="${currentMonthStr()}" onchange="loadAlertStats()" style="display:none">
        <span id="stat-custom-range" style="display:none">
          <input type="date" id="stat-from" onchange="loadAlertStats()">
          <input type="date" id="stat-to" onchange="loadAlertStats()">
        </span>
      </div>
      <div id="stat-content">Indlæser…</div>
    </div>

    <div class="card" id="card-varsel">
      <h2>Kommunalt Varsel</h2>
      <div class="ov-intro">
        Et banner på badestedets side og i push til abonnenter — ændrer
        IKKE badestedets officielle status eller risikoprocent, kun
        indholdet af banneret.
      </div>
      <div id="ov-active"></div>
      <form id="ov-form" onsubmit="return submitOverride(event)">
        <div class="ov-field">
          <label for="ov-badested">Badested</label>
          <select id="ov-badested" required></select>

// ── Fane-skift (bruger-ønske 2026-08-19) ────────────────────────────────────
// Portet mønster fra dansk-overloeb-kort.html's switchTab() — invalidateSize()
// er nødvendigt, fordi Leaflet beregner kortstørrelsen ud fra containerens
// synlige dimensioner PÅ INITIALISERINGSTIDSPUNKTET; et kort der findes inde
// i et display:none-panel (som Badevand-fanen er, når man starter på
// Overløb) renderer forkert/klippet, hvis man ikke tvinger den til at
// genberegne sin størrelse, når panelet bliver synligt igen.
function switchDashTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(el => el.classList.toggle('active', el.id === `tab-${tab}`));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  if (tab === 'overloeb' && ovlMap) setTimeout(() => ovlMap.invalidateSize(), 50);
}

// ── "Overløb"-fanen (bruger-ønske 2026-08-19) ───────────────────────────────
// Live kort + varselsliste for kommunens egne overløb (samtlige PULS-
// punkter, kloak+regnvand) og badesteder — se server.js's GET /admin/api/
// overloeb-status og overloeb-status.js for selve beregningen. Al kommune-
// scoping/bucketing sker server-side; denne kode renderer udelukkende det
// færdige resultat, samme server-autoritative princip som resten af appen.
let ovlMap = null, ovlBadestedLayer = null, ovlUdloebLayer = null, ovlRingLayer = null;
// NYT (bruger-ønske 2026-08-19 — "Samme mulighed for at vælge regn og
// kloak RBUer") — to ekstra lag, hentet dovent (kun ved første synlig-
// gørelse, se toggleOvlLayer()) fra den nye, kommune-scopede GET /admin/
// api/overloeb-rbu (server-filtreret, se dens filhoved for hvorfor — den
// rå vp3_rbu_slim.geojson er 5,6 MB landsdækkende).
let ovlRbuRegnLayer = null, ovlRbuKloakLayer = null;
let ovlRbuLoaded = false;
let ovlHorizon = 'nu';
let ovlEventSource = null;
let ovlBoundsFitted = false;
// NYT (bruger-ønske 2026-08-19, kortvælger) — hvilke af de fem lag der er
// synlige lige nu, styret af flyout-panelet nedenfor.
let ovlLayerVisible = { badesteder: true, udloeb: true, ringe: true, rbuRegn: false, rbuKloak: false };
// NYT (klik-detaljepanel) — sidste hentede udløbsliste, opslået pr. id når
// en markør klikkes, undgår en ekstra netværkstur pr. klik.
let ovlUdloebById = new Map();

// NYT — REQUIRED-SYNCED klient-duplikat af risk-model.js's riskBucket()
// (samme 0,6/0,2-tærskler som resten af appen), bruges her til at farve de
// TRE risikobjælker i klik-panelet (nu/24h/72h) samt viral/alge-chips —
// disse tal kommer allerede bucket-mærket for kortets EGEN valgte horisont
// (data.udloeb[].bucket), men panelet skal vise alle tre horisonter (og to
// ekstra scores) samtidig, og har derfor brug for at bucket'e dem selv.
function ovlRiskBucket(r) {
  if (r === null || r === undefined) return 'ingen-data';
  if (r >= 0.6) return 'roed';
  if (r >= 0.2) return 'gul';
  return 'groen';
}

const OVL_DATA_QUALITY_LABEL = { 0: 'Reelle data', 1: 'Verificeret nul', 2: 'Estimeret', 3: 'Ingen data' };

// groen/gul/roed/ingen-data matcher risk-model.js's riskBucket()-strenge
// 1:1 — lukket dækker en aktiv kommune-override med bucket 'lukket' (se
// badested-override-logic.js's OVERRIDE_BUCKETS), som kun badesteder (ikke
// udløb) kan have.
const OVL_BUCKET_COLOR = { roed: '#c84b1f', gul: '#d4a020', groen: '#2d7d4f', lukket: '#3a3a3a', 'ingen-data': '#1a6faf' };
const OVL_BUCKET_LABEL = { roed: 'Rød', gul: 'Gul', groen: 'Grøn', lukket: 'Lukket', 'ingen-data': 'Ingen data' };

// RETTET (bruger-rapporteret — "lokationsprikkerne skal have samme farver
// som fra dkvand kortet til borgerne") — badested-prikkerne farves allerede
// af OVL_BUCKET_COLOR ovenfor, SAMME diskrete tre-trins farve som
// hovedkortets riskStyle() bruger til badevandsmarkører (r>=.6 rød,
// r>=.2 gul, ellers grøn — bekræftet identisk). Men UDLØBS-prikkerne på
// hovedkortet farves IKKE sådan — de bruger riskColor(r), en KONTINUERLIG
// grøn→gul→rød-lerp (dansk-overloeb-kort.html:4518), ikke tre faste
// bucket-farver. Denne prik-funktion var derfor den reelle uoverensstemmelse
// — porteret 1:1 (REQUIRED-SYNCED duplikat, samme princip som
// computeIntensityFactor()/riskBucket() andre steder i repoet) i stedet for
// blot at genbruge OVL_BUCKET_COLOR til udløbspunkter.
function ovlRiskColor(r) {
  if (r == null) return OVL_BUCKET_COLOR['ingen-data'];
  if (r < .2) return `rgba(45,125,79,${0.5 + r})`;
  if (r < .6) {
    const t = (r - .2) / .4;
    return `rgba(${Math.round(45 + t * (212 - 45))},${Math.round(125 + t * (160 - 125))},${Math.round(79 + t * (32 - 79))},0.85)`;
  }
  const t = (r - .6) / .4;
  return `rgba(${Math.round(212 + t * (200 - 212))},${Math.round(160 - t * 160)},${Math.round(32 - t * 32)},0.9)`;
}

// NYT (bruger-ønske 2026-08-19 — "Samme mulighed for at vælge regn og
// kloak RBUer") — samme faste visningsfarver som hovedkortets
// currentRbuStyle() bruger ved fuldt indzoomet (RBU_ZOOM_NEAR) visning;
// kommune-kortet zoom-gradueres ikke (få hundrede punkter, ikke 21.375),
// så kun "tæt"-udseendet er relevant her.
const OVL_RBU_STYLE = {
  wastewater: { fill: '#8b5a2b', stroke: '#4a2c14', label: 'Kloak' },
  stormwater: { fill: '#c0392b', stroke: '#8b1a1a', label: 'Regn' },
};

// NYT: samme selv-hostede, kun-Danmark tileserver som dansk-overloeb-
// kort.html allerede bruger (se dens filhoved for hvorfor: uautentificerede
// tredjeparts-tile-CDN'er er gentagne gange blevet strammet uden varsel).
const OVL_TILE_SERVER_URL = 'https://tiles.ditbadevand.dk/styles/basic/{z}/{x}/{y}.png';

function ensureOvlMap() {
  if (ovlMap) return;
  ovlMap = L.map('ovl-map', { scrollWheelZoom: false }).setView([56.0, 10.5], 8);
  L.tileLayer(OVL_TILE_SERVER_URL, {
    attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
    maxNativeZoom: 14, // se dansk-overloeb-kort.html's tilsvarende kommentar — fliserne findes kun til zoom 14
  }).addTo(ovlMap);
  ovlBadestedLayer = L.layerGroup().addTo(ovlMap);
  ovlUdloebLayer = L.layerGroup().addTo(ovlMap);
  // NYT (kortvælger) — varselsringene lå tidligere i SAMME layer group som
  // udløbsprikkerne (ovlUdloebLayer) og kunne derfor ikke skjules
  // uafhængigt af dem — udtrukket til sit eget lag.
  ovlRingLayer = L.layerGroup().addTo(ovlMap);
  // NYT (RBU Regn/Kloak) — bevidst IKKE addTo(ovlMap) her, standard-
  // synlighed er slukket (se ovlLayerVisible) og data hentes først dovent
  // ved første tænding, se toggleOvlLayer().
  ovlRbuRegnLayer = L.layerGroup();
  ovlRbuKloakLayer = L.layerGroup();
}

// NYT (kortvælger, bruger-ønske 2026-08-19: "kortvælgeren fra dkvand gøres
// tilgængelig i kommune kortet også" + opfølgning "Samme mulighed for at
// vælge regn og kloak RBUer") — let flyout, samme visuelle mønster som
// hovedkortets #lag-btn/#lag-body (dansk-overloeb-kort.html). Badesteder/
// udløbspunkter/varselsringe er allerede beregnet server-side for kommune-
// kortet; RBU Regn/Kloak hentes dovent fra en NY, kommune-scopet rute (se
// server.js's GET /admin/api/overloeb-rbu) — IKKE strøm/kystvande/søer
// (stadig uden for "badesteder og overløbspunkter", se planens afgrænsning).
function toggleOvlLagPanel() {
  document.getElementById('ovl-lag-body').classList.toggle('open');
}

const OVL_LAYER_BY_NAME = () => ({
  badesteder: ovlBadestedLayer, udloeb: ovlUdloebLayer, ringe: ovlRingLayer,
  rbuRegn: ovlRbuRegnLayer, rbuKloak: ovlRbuKloakLayer,
});

async function toggleOvlLayer(name) {
  const btn = document.getElementById(`ovl-layerbtn-${name}`);
  // NYT: RBU-lagene hentes først ved FØRSTE tænding af ét af dem (ikke ved
  // sideindlæsning) — undgår at betale for et opslag, medmindre brugeren
  // rent faktisk beder om det. Begge lag (Regn+Kloak) hentes/bygges samlet
  // (ét API-kald), da de deler samme kilde.
  if ((name === 'rbuRegn' || name === 'rbuKloak') && !ovlRbuLoaded) {
    if (btn) { btn.disabled = true; btn.textContent = btn.textContent.replace(/^./, '⏳'); }
    await loadOvlRbu();
    if (btn) { btn.disabled = false; }
  }
  const layer = OVL_LAYER_BY_NAME()[name];
  ovlLayerVisible[name] = !ovlLayerVisible[name];
  if (ovlLayerVisible[name]) ovlMap.addLayer(layer); else ovlMap.removeLayer(layer);
  document.getElementById(`ovl-layerbtn-${name}`)?.classList.toggle('active', ovlLayerVisible[name]);
}

// NYT — henter kommunens RBU-punkter ÉN gang (server-filtreret, se
// server.js's GET /admin/api/overloeb-rbu), bygger begge lag (Regn/Kloak)
// med samme faste farver som hovedkortets currentRbuStyle() bruger ved
// fuldt indzoomet visning (se OVL_RBU_STYLE).
async function loadOvlRbu() {
  if (ovlRbuLoaded) return;
  try {
    const resp = await fetch('/admin/api/overloeb-rbu', { cache: 'no-store' });
    const data = await resp.json();
    if (!resp.ok) { console.warn('Kunne ikke hente RBU-punkter:', data.error); return; }
    for (const p of (data.rbu || [])) {
      if (p.lat == null || p.lng == null) continue;
      const style = p.isWastewater ? OVL_RBU_STYLE.wastewater : OVL_RBU_STYLE.stormwater;
      const targetLayer = p.isWastewater ? ovlRbuKloakLayer : ovlRbuRegnLayer;
      L.circleMarker([p.lat, p.lng], {
        radius: 5, fillColor: style.fill, color: style.stroke, weight: 2, fillOpacity: 0.75, opacity: 0.95,
      }).bindTooltip(
        `<strong>${escHtml(p.navn || 'RBU-punkt')}</strong><br>${escHtml(style.label)}${p.vandomraade ? ' · ' + escHtml(p.vandomraade) : ''}`,
        { sticky: true }
      ).addTo(targetLayer);
    }
    ovlRbuLoaded = true;
  } catch (e) {
    console.warn('Kunne ikke hente RBU-punkter:', e.message);
  }
}

function setOverloebHorizon(h) {
  if (h === ovlHorizon) return;
  ovlHorizon = h;
  document.querySelectorAll('#ovl-horizon-toggle .ovl-horizon-btn').forEach(b => b.classList.toggle('active', b.dataset.horizon === h));
  loadOverloebStatus();
}

async function loadOverloebStatus() {
  ensureOvlMap();
  try {
    const resp = await fetch(`/admin/api/overloeb-status?horizon=${encodeURIComponent(ovlHorizon)}`, { cache: 'no-store' });
    const data = await resp.json();
    if (!resp.ok) {
      document.getElementById('ovl-varsler-content').innerHTML = `<div class="err">${escHtml(data.error || 'Kunne ikke hente overløbsstatus.')}</div>`;
      return;
    }
    renderOverloeb(data);
  } catch (e) {
    document.getElementById('ovl-varsler-content').innerHTML = '<div class="err">Kunne ikke hente overløbsstatus — tjek din forbindelse.</div>';
  }
}

function renderOverloeb(data) {
  document.getElementById('ovl-t-roed').textContent  = data.totals.roed;
  document.getElementById('ovl-t-gul').textContent   = data.totals.gul;
  document.getElementById('ovl-t-groen').textContent = data.totals.groen;
  document.getElementById('ovl-nodata-note').textContent = data.totals.ingenData > 0
    ? `${data.totals.ingenData} udløb uden vejrdata lige nu — ikke talt med ovenfor.`
    : '';

  ovlBadestedLayer.clearLayers();
  ovlUdloebLayer.clearLayers();
  ovlRingLayer.clearLayers();
  ovlUdloebById.clear();
  const bounds = [];

  for (const b of data.badesteder) {
    if (b.lat == null || b.lng == null) continue;
    bounds.push([b.lat, b.lng]);
    const color = OVL_BUCKET_COLOR[b.bucket] || OVL_BUCKET_COLOR['ingen-data'];
    const marker = L.circleMarker([b.lat, b.lng], {
      radius: 8, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9,
    }).bindTooltip(
      `<strong>🏖 ${escHtml(b.navn)}</strong><br>${escHtml(OVL_BUCKET_LABEL[b.bucket] || b.bucket)}`,
      { sticky: true }
    ).addTo(ovlBadestedLayer);
    // NYT (bruger-krav 2026-08-20 — "samtlige informationer tilgængelige
    // for såvel badestrande som udløb ved klik"): badested-prikker havde
    // hidtil KUN et hover-tooltip, i modsætning til udløbenes fulde
    // klik-detaljepanel (openOvlUdlobPanel ovenfor). Genbruger samme delte
    // panel/overlay (#ovl-udlob-panel/#ovl-panel-sheet) — se
    // openBadestedDetailPanel().
    marker.on('click', () => openBadestedDetailPanel(b));
  }

  for (const u of data.udloeb) {
    if (u.lat == null || u.lng == null) continue;
    bounds.push([u.lat, u.lng]);
    ovlUdloebById.set(String(u.id), u);
    // RETTET: farvedes tidligere med OVL_BUCKET_COLOR (samme diskrete
    // tre-trins farve som badested-prikkerne) — hovedkortets udløbsprikker
    // bruger derimod ovlRiskColor()'s kontinuerlige grøn→gul→rød-lerp, se
    // dens filhoved.
    const color = ovlRiskColor(u.risk);
    const typeLabel = u.isWastewater ? 'Kloak' : 'Regnvand';
    const riskPct = u.risk != null ? Math.round(u.risk * 100) + '%' : 'ingen data';
    const marker = L.circleMarker([u.lat, u.lng], {
      radius: 4, fillColor: color, color: 'rgba(255,255,255,.4)', weight: 1, fillOpacity: 0.85,
    }).bindTooltip(
      `<strong>🚰 ${escHtml(u.navn)}</strong><br>${escHtml(typeLabel)} · ${escHtml(OVL_BUCKET_LABEL[u.bucket] || u.bucket)} (${riskPct})`,
      { sticky: true }
    ).addTo(ovlUdloebLayer);
    // NYT (bruger-ønske 2026-08-19): klik åbner det fulde detaljepanel —
    // samme information som badegæster ser på dkvand.dk's hovedkort.
    marker.on('click', () => openOvlUdlobPanel(u));

    // NYT: to-trins varselsring (gul/rød) — hovedkortets tilsvarende ring
    // (dansk-overloeb-kort.html) findes KUN for rød (foreRisk>.55), ingen
    // gul tærskel findes der i dag. Samme L.circleMarker-mønster
    // (fillOpacity:0, dashArray), blot med to tærskler i stedet for én.
    // Lagt i sit EGET lag (ovlRingLayer), ikke ovlUdloebLayer, så
    // kortvælgeren kan skjule ringene uafhængigt af selve prikkerne.
    if (u.bucket === 'gul' || u.bucket === 'roed') {
      // RETTET (bug 2026-08-20): interactive:false, ellers opfanger denne
      // gennemsigtige ring klik (Leaflets pointer-events dækker hele
      // fill-arealet, ikke kun stregen) FØR de når prikken under, som har
      // den rigtige click-handler (linje 1005) — se openOvlUdlobPanel().
      L.circleMarker([u.lat, u.lng], {
        radius: 12, fillOpacity: 0, weight: 2, dashArray: '4,4',
        color: u.bucket === 'roed' ? '#ff6040' : '#f0c040',
        interactive: false,
      }).addTo(ovlRingLayer);
    }
  }

  if (!ovlBoundsFitted && bounds.length > 0) {
    ovlMap.fitBounds(bounds, { padding: [24, 24], maxZoom: 12 });
    ovlBoundsFitted = true;
  }

  const varslerEl = document.getElementById('ovl-varsler-content');
  if (data.varsler.length === 0) {
    varslerEl.innerHTML = '<div class="ovl-alert-empty">Ingen aktive gul/rød-varsler for kommunens overløb lige nu.</div>';
  } else {
    varslerEl.innerHTML = data.varsler.map(u => {
      const typeLabel = u.isWastewater ? 'Kloak' : 'Regnvand';
      const riskPct = u.risk != null ? Math.round(u.risk * 100) : null;
      return `
        <div class="ovl-alert-row risk-${u.bucket}">
          <div class="ovl-alert-top">
            <span class="ovl-alert-name">${escHtml(u.navn)}</span>
            <span class="ovl-alert-chip risk-${u.bucket}">${escHtml(OVL_BUCKET_LABEL[u.bucket])}${riskPct != null ? ' · ' + riskPct + '%' : ''}</span>
          </div>
          <div class="ovl-alert-meta">${escHtml(typeLabel)} · prognose ${(u.forecastMM ?? 0).toFixed(1)} mm · observeret ${(u.todayMM ?? 0).toFixed(1)} mm</div>
        </div>
      `;
    }).join('');
  }
}

// NYT — kompakt 7-dages søjlegraf (timetal fra hourlyWeek summeret pr.
// døgn), samme lette SVG-teknik som renderVarselBarChart() men bevidst
// ikke genbrugt direkte — enkeltfarvet mm-graf er semantisk noget andet
// end den to-farvede gul/rød-varselsstak.
function renderOvlRainChart(containerId, hourlyWeek) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  if (!hourlyWeek || hourlyWeek.length === 0) {
    wrap.innerHTML = '<div class="trend-empty">Ingen nedbørsdata</div>';
    return;
  }
  const days = [];
  for (let i = 0; i < hourlyWeek.length; i += 24) {
    days.push(hourlyWeek.slice(i, i + 24).reduce((a, b) => a + (b || 0), 0));
  }
  const W = 300, H = 80, padB = 14;
  const vMax = Math.max(1, ...days);
  const slotW = W / days.length;
  const barW = Math.max(1, slotW - 2);
  const bars = days.map((v, i) => {
    const h = (v / vMax) * (H - padB);
    const x = i * slotW + 1;
    const y = H - padB - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" fill="#4fb8d6"><title>${v.toFixed(1)} mm</title></rect>`;
  }).join('');
  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:80px" role="img" aria-label="Nedbør seneste 7 dage">
      ${bars}
      <text x="0" y="${H}" font-size="8" fill="#9fb0bb">−7d</text>
      <text x="${W}" y="${H}" font-size="8" fill="#9fb0bb" text-anchor="end">i dag</text>
    </svg>
  `;
}

// NYT (bruger-krav: "live med en socketforbindelse ... automatisk
// opdateres hver gang der er en opdatering af overløbenes status") —
// EventSource, se server.js's GET /admin/api/overloeb-stream for hvorfor
// Server-Sent Events blev valgt frem for en WebSocket-pakke. Sender kun en
// let ping; selve gendataet genhentes altid via loadOverloebStatus(), som
// respekterer den aktuelt valgte horisont. EventSource genopretter selv
// forbindelsen ved fejl/afbrydelse — ingen manuel reconnect-logik her.
function connectOverloebStream() {
  if (ovlEventSource) return;
  ovlEventSource = new EventSource('/admin/api/overloeb-stream');
  ovlEventSource.addEventListener('overloeb-updated', () => loadOverloebStatus());
}

// fuldskærm) — fuldskærms-MÅLET er nu #ovl-map-fs-wrap, IKKE #ovl-map selv:
// Fullscreen API'ens "top layer" viser kun det fuldskærmsgjorte element og
// dets EGNE efterkommere, aldrig en søskende (uanset z-index) — #ovl-udlob-
// panel skal derfor være en efterkommer af samme element som #ovl-map, for
// at kunne vises ovenpå kortet mens det er fuldskærm. Leaflet skal stadig
// blot genberegne sin egen containerstørrelse (invalidateSize()), samme
// nødvendighed som ved fane-skift (se switchDashTab()).
function toggleOvlFullscreen() {
  const wrapEl = document.getElementById('ovl-map-fs-wrap');
  if (!wrapEl) return;
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    (wrapEl.requestFullscreen || wrapEl.webkitRequestFullscreen)?.call(wrapEl);
  }
}
document.addEventListener('fullscreenchange', () => { if (ovlMap) setTimeout(() => ovlMap.invalidateSize(), 50); });

/**
 * RETTET (bruger-krav 2026-08-20 — fusioneret ind i Badevandssteder-
 * panelet): viste tidligere en altid-synlig liste for ALLE badesteder i
 * sit eget kort (Badevandshistorik). Henter nu i stedet ÉT samlet kald pr.
 * måned (cached, se _monthBucketsCache), slået op pr. badested når en
 * række foldes ud i toggleBadestedHistory() — se buildMonthBarHtml().
 * Server-siden (GET /admin/api/badested-history,
 * app-metrics.js's getMonthlyRiskBuckets()) er uændret.
 */
const _monthBucketsCache = new Map(); // 'YYYY-MM' -> Map<badestedId, {green,yellow,red,noData}>
async function getMonthBuckets(month) {
  if (_monthBucketsCache.has(month)) return _monthBucketsCache.get(month);
  const map = new Map();
  try {
    const resp = await fetch(`/admin/api/badested-history?month=${encodeURIComponent(month)}`, { cache: 'no-store' });
    const data = await resp.json();
    if (resp.ok && Array.isArray(data.badesteder)) {
      for (const b of data.badesteder) map.set(String(b.id), b);
    }
  } catch (e) { /* getMonthBarHtml() falder tilbage til "ingen data" nedenfor */ }
  _monthBucketsCache.set(month, map);
  return map;
}

// NYT: procenterne er bevidst af (green+yellow+red+noData), IKKE kun af de
// dage der HAR data — en måned med mest noData skal vise en synligt kort
// farvet bjælke, ikke misvisende strække få reelle dage ud til at udfylde
// hele bjælken. Samme visuelle sprog (.hist-bar/.hist-seg-*) som det
// tidligere separate Badevandshistorik-kort brugte.
function buildMonthBarHtml(b) {
  if (!b) return '<div style="font-size:.75rem;color:var(--ink-soft)">Ingen data for denne måned.</div>';
  const total = (b.green || 0) + (b.yellow || 0) + (b.red || 0) + (b.noData || 0);
  const pct = n => total > 0 ? Math.round(100 * n / total) : 0;
  return `
    <div class="hist-bar">
      <div class="hist-seg-green"  style="width:${pct(b.green)}%"  title="${b.green} grønne dage"></div>
      <div class="hist-seg-yellow" style="width:${pct(b.yellow)}%" title="${b.yellow} gule dage"></div>
      <div class="hist-seg-red"    style="width:${pct(b.red)}%"    title="${b.red} røde dage"></div>
    </div>
    <div class="hist-counts">🟢 ${b.green}&nbsp;&nbsp;🟡 ${b.yellow}&nbsp;&nbsp;🔴 ${b.red}${b.noData ? `&nbsp;&nbsp;· ${b.noData} dage uden data` : ''}</div>
  `;
}

// NYT (bruger-ønske 2026-08-20) — samme afhængighedsfri SVG-donut som
// dansk-overloeb-kort.html's badested-detaljepanel (se dens filhoved for
// den fulde begrundelse) — duplikeret HER (ikke delt via en fælles fil)
// bevidst: to forskellige temaer (dette dashboard er mørkt, det offentlige
// kort er lyst) og to forskellige "ingen data"-farvekonventioner
// (OVL_BUCKET_COLOR['ingen-data'] = blå her, grå der) gjorde en fælles,
// parameteriseret udgave mere kompleks end værd for ~40 linjer kode. Hold
// tærskler/rækkefølge (lav→moderat→høj→ingenData) i sync med den anden,
// hvis farverne nogensinde ændres.
function buildRiskDonutSvg(counts) {
  const { lav = 0, moderat = 0, hoej = 0, ingenData = 0 } = counts || {};
  const total = lav + moderat + hoej + ingenData;
  const size = 76, r = 30, cx = size / 2, cy = size / 2, strokeW = 11;
  const circumference = 2 * Math.PI * r;
  if (total === 0) {
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Ingen data endnu">` +
      `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="${strokeW}"></circle></svg>`;
  }
  const segments = [
    { n: lav,       color: '#2d7d4f' },
    { n: moderat,   color: '#d4a020' },
    { n: hoej,      color: '#c84b1f' },
    { n: ingenData, color: '#1a6faf' },
  ].filter(s => s.n > 0);
  const gap = segments.length > 1 ? 2.5 : 0;
  let offset = 0;
  const strokes = segments.map(s => {
    const len  = (s.n / total) * circumference;
    const dash = Math.max(len - gap, 0);
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${strokeW}" ` +
      `stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" ` +
      `transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += len;
    return el;
  }).join('');
  const daysWithData = lav + moderat + hoej;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" ` +
    `aria-label="${lav} sikre dage, ${moderat} moderat risiko, ${hoej} høj risiko${ingenData ? ', ' + ingenData + ' uden data' : ''}">` +
    strokes +
    `<text x="${cx}" y="${cy + 1}" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="800" fill="var(--ink)">${daysWithData}</text>` +
    `<text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="6" fill="var(--ink-soft)">dage m. data</text>` +
    `</svg>`;
}

// NYT (bruger-ønske 2026-08-20) — ren tekst, INGEN farvet baggrund (efter
// eksplicit ønske, i modsætning til dansk-overloeb-kort.html's chips).
function buildRiskLegendHtml(counts) {
  const { lav = 0, moderat = 0, hoej = 0, ingenData = 0 } = counts || {};
  const rows = [

    moderat   > 0 ? `<div>Moderat ${moderat} ${moderat === 1 ? 'dag' : 'dage'}</div>`           : '',
    hoej      > 0 ? `<div>Høj risiko ${hoej} ${hoej === 1 ? 'dag' : 'dage'}</div>`               : '',
    ingenData > 0 ? `<div>Ingen data ${ingenData} ${ingenData === 1 ? 'dag' : 'dage'}</div>`     : '',

// NYT (bruger-ønske 2026-08-20) — folder historik-panelet ud/sammen for
// ÉN badested-række. Henter kun ved FØRSTE åbning (se _badestedHistoryCache),
// samme genbrugte offentlige endpoint (GET /api/badested-history-summary/:id)
// som badested-detaljesiden allerede kalder.
const _badestedHistoryCache = new Map(); // badestedId -> { week, month }
async function toggleBadestedHistory(badestedId) {
  const el = document.getElementById(`stat-detail-${badestedId}`);
  if (!el) return;
  const isOpen = el.classList.toggle('open');
  if (!isOpen || el.dataset.loaded === '1') return;

  el.innerHTML = '<div style="color:var(--ink-soft);font-size:.8rem;padding:.4rem 0">Indlæser…</div>';
  try {
    let summary = _badestedHistoryCache.get(badestedId);
    const summaryPromise = summary ? Promise.resolve(summary) : (async () => {
      const resp = await fetch(`/api/badested-history-summary/${encodeURIComponent(badestedId)}`, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      _badestedHistoryCache.set(badestedId, data);
      return data;
    })();
    // NYT (bruger-krav 2026-08-20 — fusioneret Badevandshistorik ind her):
    // kørt PARALLELT med summary-opslaget ovenfor, ikke sekventielt bagefter.
    const monthPromise = getMonthBuckets(currentMonthStr());
    const [resolvedSummary, monthBuckets] = await Promise.all([summaryPromise, monthPromise]);
    summary = resolvedSummary;
    const block = (title, counts) => {
      if (!counts || counts.daysFound === 0) {
        return `<div class="bv-history-block">
          <div class="bv-history-block-title">${title}</div>
          <div style="font-size:.75rem;color:var(--ink-soft);padding:.6rem 0">Endnu ingen historik.</div>
        </div>`;
      }
      return `<div class="bv-history-block">
        <div class="bv-history-block-title">${title}</div>
        <div class="bv-history-inner">${buildRiskDonutSvg(counts)}${buildRiskLegendHtml(counts)}</div>
      </div>`;
    };
    el.innerHTML = `
      <div class="bv-history-summary">${block('Sidste 7 dage', summary.week)}${block('Sidste 30 dage', summary.month)}</div>
      <div style="margin-top:.6rem">
        <div class="bv-history-block-title">Denne måned</div>
        ${buildMonthBarHtml(monthBuckets.get(String(badestedId)))}
      </div>
    `;
    el.dataset.loaded = '1';
  } catch (e) {
    el.innerHTML = '<div style="color:var(--ink-soft);font-size:.8rem;padding:.4rem 0">Kunne ikke hente historik lige nu.</div>';
  }
}

async function loadAlertStats() {
  const statEl = document.getElementById('stat-content');
  if (!statEl) return;
  statEl.textContent = 'Indlæser…';
  const period = document.getElementById('stat-period').value;
  const month = document.getElementById('stat-month').value;
  const qs = new URLSearchParams();
  if (period === 'custom') {
    const from = document.getElementById('stat-from').value;
    const to   = document.getElementById('stat-to').value;
    if (!from || !to) {
      statEl.innerHTML = '<div class="hist-warning">Vælg både fra- og til-dato for en brugerdefineret periode.</div>';
      return;
    }
    qs.set('from', from);
    qs.set('to', to);
  } else {
    qs.set('period', period);
    if (period === 'month' && month) qs.set('month', month);
  }
  try {
    const resp = await fetch(`/admin/api/badested-alert-stats?${qs.toString()}`, { cache: 'no-store' });
    const data = await resp.json();
    if (!resp.ok) {
      statEl.innerHTML = `<div class="err">${escHtml(data.error || 'Kunne ikke hente statistik.')}</div>`;
      return;
    }
    if (data.warning) {
      statEl.innerHTML = `<div class="hist-warning">${escHtml(data.warning)}</div>`;
      return;
    }
    if (!data.badesteder || data.badesteder.length === 0) {
      statEl.innerHTML = '<div class="stat-empty">Ingen badesteder fundet.</div>';
      return;
    }
    // NYT (bruger-ønske 2026-08-20) — hver række er nu klikbar og folder
    // historik-panelet (2 donuts, samme kilde som badested-detaljesiden)
    // ud i #stat-detail-${b.id} — se toggleBadestedHistory().
    statEl.innerHTML = data.badesteder.map(b => `
      <div class="stat-row" onclick="toggleBadestedHistory('${b.id}')">
        <span class="stat-name">${escHtml(b.navn)}</span>
        <span class="stat-nums">${b.alertCount} varsel${b.alertCount === 1 ? '' : 'er'} · ${b.subscriberCount} abonnent${b.subscriberCount === 1 ? '' : 'er'}</span>

  } catch (e) {
    statEl.innerHTML = '<div class="err">Kunne ikke hente statistik — tjek din forbindelse.</div>';
  }
}

// ── Kommunepakke, modul 7 — kommune-scopet statistik ────────────────────────
// renderTrendChart/fmtDateShort/fmtCount er portet 1:1 fra stats.html (se
// den for den fulde dataviz-begrundelse: 2px rund-cap-linje, ~16%
// arealfyld-opacitet, hårfine gridlinjer, slutpunkt-mærkat, crosshair+
// tooltip på hover) — IKKE genimplementeret, for at garantere identisk
// visuel adfærd/ydelse mellem de to sider.
function fmtDateShort(d) {
  const [, m, day] = d.split('-');
  return `${day}/${m}`;
}
function fmtCount(n) { return Math.round(n).toLocaleString('da-DK'); }

let _trendChartSeq = 0;
function renderTrendChart(containerId, points, opts) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  if (points.length === 0) {
    wrap.innerHTML = '<div class="trend-empty">Ingen data endnu — første punkt gemmes i løbet af i dag</div>';
    return;
  }
  if (points.length === 1) {
    wrap.innerHTML = `<div class="trend-empty">${fmtCount(points[0].value)} (${fmtDateShort(points[0].date)}) — for lidt historik til en graf endnu</div>`;
    return;
  }

  const W = 600, H = 150;
  const padL = 4, padR = 46, padT = 10, padB = 20;
  const plotL = padL, plotR = W - padR, plotT = padT, plotB = H - padB;
  const plotW = plotR - plotL, plotH = plotB - plotT;

  const values = points.map(p => p.value);
  let vMin = Math.min(...values), vMax = Math.max(...values);
  if (vMin === vMax) { vMin = Math.max(0, vMin - 1); vMax = vMax + 1; }
  const yPad = (vMax - vMin) * 0.12;
  vMin = Math.max(0, vMin - yPad);
  vMax = vMax + yPad;

  const xAt = i => plotL + (plotW * i) / (points.length - 1);
  const yAt = v => plotB - ((v - vMin) / (vMax - vMin)) * plotH;

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${xAt(i).toFixed(1)},${yAt(p.value).toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L${xAt(points.length - 1).toFixed(1)},${plotB} L${xAt(0).toFixed(1)},${plotB} Z`;
  const last = points[points.length - 1];
  const gradId = `trendGrad${_trendChartSeq++}`;

  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label} over tid, seneste værdi ${fmtCount(last.value)}">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" class="trend-grad-stop-1"/>
          <stop offset="100%" class="trend-grad-stop-2"/>
        </linearGradient>
      </defs>
      <line class="trend-grid-line" x1="${plotL}" y1="${plotT}" x2="${plotR}" y2="${plotT}"/>
      <line class="trend-grid-line" x1="${plotL}" y1="${(plotT + plotB) / 2}" x2="${plotR}" y2="${(plotT + plotB) / 2}"/>
      <line class="trend-grid-line" x1="${plotL}" y1="${plotB}" x2="${plotR}" y2="${plotB}"/>
      <path fill="url(#${gradId})" d="${areaPath}"/>
      <path class="trend-line" d="${linePath}"/>
      <circle class="trend-end-dot" cx="${xAt(points.length - 1).toFixed(1)}" cy="${yAt(last.value).toFixed(1)}" r="5"/>
      <text class="trend-end-label" x="${(plotR + 8).toFixed(1)}" y="${yAt(last.value).toFixed(1)}" dominant-baseline="middle">${fmtCount(last.value)}</text>
      <text class="trend-axis-label" x="${plotL}" y="${H - 4}">${fmtDateShort(points[0].date)}</text>
      <text class="trend-axis-label" x="${plotR}" y="${H - 4}" text-anchor="end">${fmtDateShort(last.date)}</text>
      <line class="trend-crosshair" x1="0" y1="${plotT}" x2="0" y2="${plotB}"/>
      <circle class="trend-hover-dot" r="5"/>
      <rect class="trend-hit-layer" x="${plotL}" y="0" width="${plotW}" height="${H}"/>
    </svg>
    <div class="trend-tooltip"><span class="tt-date"></span><span class="tt-value"></span></div>
  `;

  const svgEl      = wrap.querySelector('svg');
  const hitLayer   = wrap.querySelector('.trend-hit-layer');
  const crosshair  = wrap.querySelector('.trend-crosshair');
  const hoverDot   = wrap.querySelector('.trend-hover-dot');
  const tooltip    = wrap.querySelector('.trend-tooltip');
  const ttDate     = tooltip.querySelector('.tt-date');
  const ttValue    = tooltip.querySelector('.tt-value');

  function showAt(clientX) {
    const rect = svgEl.getBoundingClientRect();
    const svgX = ((clientX - rect.left) / rect.width) * W;
    let idx = Math.round(((svgX - plotL) / plotW) * (points.length - 1));
    idx = Math.max(0, Math.min(points.length - 1, idx));
    const p = points[idx];
    const px = xAt(idx), py = yAt(p.value);
    crosshair.setAttribute('x1', px); crosshair.setAttribute('x2', px);
    crosshair.style.opacity = '1';
    hoverDot.setAttribute('cx', px); hoverDot.setAttribute('cy', py);
    hoverDot.style.opacity = '1';
    tooltip.style.opacity = '1';
    tooltip.style.left = `${(px / W) * 100}%`;
    tooltip.style.top  = `${(py / H) * 100}%`;
    ttDate.textContent  = p.date;
    ttValue.textContent = fmtCount(p.value);
  }
  function hide() {
    crosshair.style.opacity = '0';
    hoverDot.style.opacity  = '0';
    tooltip.style.opacity   = '0';
  }
  hitLayer.addEventListener('pointermove', e => showAt(e.clientX));
  hitLayer.addEventListener('pointerdown', e => showAt(e.clientX));
  hitLayer.addEventListener('pointerleave', hide);
}

// NYT (Overløb-fanen, historik-graf — bruger-ønske 2026-08-19) — stablede
// søjler (gul i bunden, rød ovenpå), IKKE en genbrug/udvidelse af
// renderTrendChart() ovenfor: en to-farvet stak kommunikerer "gul OG rød pr.
// dag" tydeligere end to overlappende linjer/arealer ville. Genbruger samme
// SVG-viewBox-dimensioner og .trend-grid-line/.trend-axis-label/.trend-empty-
// stile som renderTrendChart, for visuel konsistens — men ingen pointer-
// crosshair-tooltip, native <title> pr. søjle er nok til diskrete dags-bars.
function renderVarselBarChart(containerId, points) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  if (points.length === 0) {
    wrap.innerHTML = '<div class="trend-empty">Ingen overløbsvarsler registreret i perioden endnu</div>';
    return;
  }

  const W = 600, H = 150;
  const padL = 4, padR = 8, padT = 10, padB = 20;
  const plotL = padL, plotR = W - padR, plotT = padT, plotB = H - padB;
  const plotW = plotR - plotL, plotH = plotB - plotT;

  const totals = points.map(p => p.gul + p.roed);
  const vMax = Math.max(1, ...totals);
  const barGap = 1;
  const barW = Math.max(0.6, plotW / points.length - barGap);
  const xAt = i => plotL + i * (plotW / points.length);

  const bars = points.map((p, i) => {
    const x = xAt(i).toFixed(1);
    const gulH = (p.gul / vMax) * plotH;
    const roedH = (p.roed / vMax) * plotH;
    const gulY = plotB - gulH;
    const roedY = gulY - roedH;
    const titleText = `${escHtml(p.date)}: ${p.gul} gul, ${p.roed} rød`;
    return `<g>
      ${p.gul > 0  ? `<rect x="${x}" y="${gulY.toFixed(1)}" width="${barW.toFixed(1)}" height="${gulH.toFixed(1)}" fill="#d4a020"><title>${titleText}</title></rect>` : ''}
      ${p.roed > 0 ? `<rect x="${x}" y="${roedY.toFixed(1)}" width="${barW.toFixed(1)}" height="${roedH.toFixed(1)}" fill="#c84b1f"><title>${titleText}</title></rect>` : ''}
    </g>`;
  }).join('');

  const totalSum = totals.reduce((a, b) => a + b, 0);

  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Overløbsvarsler over tid, i alt ${totalSum} i perioden">
      <line class="trend-grid-line" x1="${plotL}" y1="${plotT}" x2="${plotR}" y2="${plotT}"/>
      <line class="trend-grid-line" x1="${plotL}" y1="${plotB}" x2="${plotR}" y2="${plotB}"/>
      ${bars}
      <text class="trend-axis-label" x="${plotL}" y="${H - 4}">${fmtDateShort(points[0].date)}</text>
      <text class="trend-axis-label" x="${plotR}" y="${H - 4}" text-anchor="end">${fmtDateShort(points[points.length - 1].date)}</text>
    </svg>
  `;
}
