// ── Borgervurderinger, kun læsning (bruger-ønske 2026-08-18) ────────────────
// Meta portet 1:1 fra dansk-overloeb-kort.html's BV_VURDERING_LAYER1_META
// (samme icon/farve/label), for at borgerens indsendelse og kommunens
// visning heraf ser ens ud. 'alger_set' og 'affald' er FLAGGEDE typer — se
// isFlagged() nedenfor — fordi de er dem der reelt kan udløse en fysisk
// besigtigelse (bruger-krav), ikke en teknisk egenskab ved dataene.
const VURD_TYPE_META = {
  ser_fint_ud: { icon: '✓',  color: '#2d7d4f', label: 'Ser fint ud' },
  alger_set:   { icon: '🌿', color: '#d4a020', label: 'Alger set' },
  uklart_vand: { icon: '💧', color: '#c84b1f', label: 'Uklart vand' },
  affald:      { icon: '🗑', color: '#5a6b78', label: 'Affald' },
};
const VURD_FLAGGED_TYPES = new Set(['alger_set', 'affald']);
const VURD_ALGAE_LEVEL_LABELS = { ingen: 'Ingen', faa: 'Få', mange: 'Mange' };
const VURD_PAGE_SIZE = 10; // bruger-ønske 2026-08-18 — kun 10 ad gangen, med forrige/næste

let _vurderingerCache = [];
let _vurdPage = 0; // 0-indekseret, nulstilles ved ny hentning eller filterskift

function isFlaggedVurdering(v) {
  return v.types.some(t => VURD_FLAGGED_TYPES.has(t));
}

async function loadVurderinger() {
  const el = document.getElementById('vurd-content');
  if (!el) return;
  el.textContent = 'Indlæser…';
  try {
    const resp = await fetch('/admin/api/vurderinger', { cache: 'no-store' });
    const data = await resp.json();
    if (!resp.ok) {
      el.innerHTML = `<div class="err">${escHtml(data.error || 'Kunne ikke hente indberetninger.')}</div>`;
      return;
    }
    _vurderingerCache = data.vurderinger || [];
    _vurdPage = 0;
    renderVurderinger();
  } catch (e) {
    el.innerHTML = '<div class="err">Kunne ikke hente indberetninger — tjek din forbindelse.</div>';
  }
}

// NYT (bruger-ønske 2026-08-18): filterskift skal starte forfra på side 1 —
// ellers kan man ende på en side der ligger ud over det nu-filtrerede
// resultats længde, se clampingen i renderVurderinger() nedenfor (som ville
// dække over det, men starter man alligevel forfra er det mindre overraskende).
function onVurdFilterChange() {
  _vurdPage = 0;
  renderVurderinger();
}

function changeVurdPage(delta) {
  _vurdPage += delta;
  renderVurderinger();
}

function renderVurderinger() {
  const el = document.getElementById('vurd-content');
  if (!el) return;
  const filter = document.getElementById('vurd-filter').value;
  let list = _vurderingerCache;
  if (filter === 'prioritet') list = list.filter(isFlaggedVurdering);
  else if (filter !== 'alle') list = list.filter(v => v.types.includes(filter));

  if (list.length === 0) {
    el.innerHTML = '<div class="vurd-empty">Ingen indberetninger fundet for dette filter.</div>';
    return;
  }

  const totalPages = Math.ceil(list.length / VURD_PAGE_SIZE);
  _vurdPage = Math.max(0, Math.min(_vurdPage, totalPages - 1));
  const start = _vurdPage * VURD_PAGE_SIZE;
  const pageList = list.slice(start, start + VURD_PAGE_SIZE);

  const rowsHtml = pageList.map(v => {
    const flagged = isFlaggedVurdering(v);
    const badgesHtml = v.types.map(t => {
      const meta = VURD_TYPE_META[t] || { icon: '•', color: 'var(--ink-soft)', label: t };
      return `<span class="vurd-type-badge" style="color:${meta.color}">${meta.icon} ${escHtml(meta.label)}${t === 'alger_set' && v.algaeLevel ? ` (${escHtml(VURD_ALGAE_LEVEL_LABELS[v.algaeLevel] || v.algaeLevel)})` : ''}</span>`;
    }).join('');
    const nameHtml = v.badestedSlug
      ? `<a href="/badested/${encodeURIComponent(v.badestedSlug)}" target="_blank" rel="noopener">${escHtml(v.badestedNavn)}</a>`
      : escHtml(v.badestedNavn);
    return `
      <div class="vurd-row${flagged ? ' vurd-flagged' : ''}">
        <div class="vurd-row-top">
          <span class="vurd-badested">${nameHtml}</span>
          <span class="vurd-time">${fmtDateTime(v.createdAt)}</span>
        </div>
        <div class="vurd-types">${badgesHtml}</div>
        ${flagged ? '<div class="vurd-flag-note">⚠ Kan kræve besigtigelse</div>' : ''}
        ${v.photoUrl ? `<a class="vurd-photo-link" href="${escHtml(v.photoUrl)}" target="_blank" rel="noopener">Se indsendt foto <img src="${escHtml(v.photoUrl)}" alt="Foto vedhæftet vurdering" loading="lazy"></a>` : ''}
      </div>
    `;
  }).join('');

  const pagerHtml = totalPages > 1 ? `
    <div class="vurd-pager">
      <button type="button" onclick="changeVurdPage(-1)" ${_vurdPage === 0 ? 'disabled' : ''}>‹ Forrige</button>
      <span class="vurd-pager-note">${start + 1}–${Math.min(start + VURD_PAGE_SIZE, list.length)} af ${list.length}</span>
      <button type="button" onclick="changeVurdPage(1)" ${_vurdPage >= totalPages - 1 ? 'disabled' : ''}>Næste ›</button>
    </div>` : '';

  el.innerHTML = `<div class="vurd-list">${rowsHtml}</div>${pagerHtml}`;
}

// ── Kommune-benchmark-rapporten (bruger-ønske) ──────────────────────────────
// Se server.js's computeKommuneBenchmark()/GET /admin/api/kommune-benchmark
// for selve beregningen og KPI-definitionerne — denne sektion viser blot
// det allerede-rangerede resultat. "Egen kommune" identificeres ved at
// normalisere window.__TENANT__.name på SAMME måde som backend'ens
// kommuneNavn (strip "kommune"-suffiks, trim), IKKE en streng byggeklods-
// funktion som normalizeKommuneKey() (den findes kun server-side, se
// slug-index.js) — kun til visuel fremhævelse her, ikke til opslag.
function kbOwnKommuneNavn() {
  return (window.__TENANT__?.name || '').replace(/\s*kommune\s*$/i, '').trim();
}

// NYT: "Måned" og "Brugerdefineret" viser deres respektive ekstra input(s);
// øvrige presets henter med det samme, samme mønster som
// onStatPeriodChange() ovenfor.
function onKbPeriodChange() {
  const period = document.getElementById('kb-period').value;
  document.getElementById('kb-month').style.display = period === 'month' ? '' : 'none';
  document.getElementById('kb-custom-range').style.display = period === 'custom' ? '' : 'none';
  if (period !== 'custom') loadKommuneBenchmark();
}

// NYT (bruger-ønske 2026-08-17 — "rapporterne skal være som valgbare
// rapporter med rapportnavn og periode, ikke listet efter hinanden"):
// #kb-report vælger HVILKEN af de fem rapporter der vises — kun ÉN ad
// gangen, ikke alle fem sammenkædet som tidligere. Datakvalitet er
// periode-UAFHÆNGIG (se computeKommuneBenchmark()'s filhoved i server.js —
// PULS-grunddata har ingen tidsdimension pr. udløb), så periodevælgeren
// skjules for netop den rapport i stedet for at vise en periode der reelt
// ikke ændrer noget.
function onKbReportChange() {
  const report = document.getElementById('kb-report').value;
  document.getElementById('kb-period-controls').style.display = report === 'datakvalitet' ? 'none' : '';
  loadKommuneBenchmark();
}

function kbRankTable(unitNote, list, key, rangKey, ownNavn) {
  const sorted = [...list].sort((a, b) => a[rangKey] - b[rangKey]);
  const rowsHtml = sorted.map(r => `
    <tr${r.kommuneNavn.toLowerCase() === ownNavn.toLowerCase() ? ' class="kb-own-row"' : ''}>
      <td>#${r[rangKey]}</td><td>${escHtml(r.kommuneNavn)}</td>
      <td class="n">${r[key].toFixed(2)}</td>
    </tr>`).join('');
  return `
    <div class="kb-unit-note">${escHtml(unitNote)}</div>
    <table class="kstat-table"><thead><tr style="color:var(--ink-soft);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em">
      <td>#</td><td>Kommune</td><td class="n">Indekseret</td>
    </tr></thead><tbody>${rowsHtml}</tbody></table>
    ${kbLavNHtml}`;
}

// Genbrugt af alle fire periode-afhængige rapporter (Samlet/Varsler/
// Lukkedage/Badestedsvurderinger) — samme udelukkede kommuner uanset
// hvilken af de tre metrikker der ses på, se computeKommuneBenchmark().
// IKKE vist for Datakvalitet (den lav-n-udelukker slet ikke, se dens
// filhoved). Sat som modul-scoped variabel af loadKommuneBenchmark() lige
// før den kaldes — undgår at sende samme argument gennem alle fire
// rapport-byggere.
let kbLavNHtml = '';

async function loadKommuneBenchmark() {
  const el = document.getElementById('kb-content');
  if (!el) return;
  el.textContent = 'Indlæser…';

  const report = document.getElementById('kb-report').value;
  const qs = new URLSearchParams();
  if (report !== 'datakvalitet') {
    const period = document.getElementById('kb-period').value;
    if (period === 'custom') {
      const from = document.getElementById('kb-from').value;
      const to   = document.getElementById('kb-to').value;
      if (!from || !to) {
        el.innerHTML = '<div class="hist-warning">Vælg både fra- og til-dato for en brugerdefineret periode.</div>';
        return;
      }
      qs.set('from', from);
      qs.set('to', to);
    } else {
      qs.set('period', period);
      if (period === 'month') qs.set('month', document.getElementById('kb-month').value);
    }
  } else {
    qs.set('period', 'quarter'); // ligegyldigt for datakvalitet — kun en gyldig period er påkrævet af ruten
  }

  try {
    const resp = await fetch(`/admin/api/kommune-benchmark?${qs.toString()}`, { cache: 'no-store' });
    const data = await resp.json();
    if (!resp.ok) {
      el.innerHTML = `<div class="err">${escHtml(data.error || 'Kunne ikke hente kommune-benchmark.')}</div>`;
      return;
    }

    const ownNavn = kbOwnKommuneNavn();
    const N = data.hovedranking.length;

    kbLavNHtml = data.lavN.length
      ? `<h3 class="kb-subhead">For få badesteder til sammenligning (under 3)</h3>
         <div class="kb-lav-n-list">${data.lavN.map(r => `${escHtml(r.kommuneNavn)} (${r.badestedCount})`).join(' · ')}</div>`
      : '';

    if (report === 'datakvalitet') {
      const dqRows = data.datakvalitet.map(d => `
        <tr${d.kommuneNavn.toLowerCase() === ownNavn.toLowerCase() ? ' class="kb-own-row"' : ''}>
          <td>${escHtml(d.kommuneNavn)}</td>
          <td class="n">${Math.round(d.andel * 100)}%</td>
          <td class="n">${d.reeltMaalt} / ${d.udloebPunkter}</td>
        </tr>`).join('');
      el.innerHTML = `
        <div class="kb-unit-note">Andel af kommunens PULS-udløbspunkter med reelt målt data (ikke estimeret/ingen data). Vises SEPARAT fra de øvrige rapporter, indgår ikke i samlet placering — forklarer hvorfor en kommune med bedre overvågning kan have flere registrerede hændelser uden at det reelt er et dårligere resultat.</div>
        <table class="kstat-table"><thead><tr style="color:var(--ink-soft);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em">
          <td>Kommune</td><td class="n">Andel</td><td class="n">Målt / i alt</td>
        </tr></thead><tbody>${dqRows}</tbody></table>`;
      return;
    }

    if (report === 'samlet') {
      const own = data.hovedranking.find(r => r.kommuneNavn.toLowerCase() === ownNavn.toLowerCase());
      const summaryHtml = own
        ? `<div class="kstat-grid"><div class="kstat-box">
             <div class="kstat-label">Samlet placering</div>
             <div class="kstat-value">#${Math.round(own.samletRang)} af ${N}</div>
             <div class="kstat-note">${escHtml(own.kommuneNavn)} · ${own.badestedCount} badesteder · ligevægtet gennemsnit af Varsler/Lukkedage/Badestedsindberetninger</div>
           </div></div>`
        : `<div class="hist-warning">Jeres kommune indgår ikke i hovedrangeringen for denne periode — enten under grænsen på 3 badesteder (se listen nederst), eller ingen matchende data endnu.</div>`;
      const sorted = [...data.hovedranking].sort((a, b) => a.samletRang - b.samletRang);
      // NYT (bruger-ønske 2026-08-18): total # indberetninger (RÅ tal, ikke
      // indekseret pr. badested som rangVurderinger er) — vurderingerRaw
      // findes allerede pr. række, se computeKommuneBenchmark() i server.js.
      const rowsHtml = sorted.map(r => `
        <tr${r.kommuneNavn.toLowerCase() === ownNavn.toLowerCase() ? ' class="kb-own-row"' : ''}>
          <td>#${Math.round(r.samletRang * 10) / 10}</td><td>${escHtml(r.kommuneNavn)}</td>
          <td class="n">#${r.rangVarsler}</td><td class="n">#${r.rangLukkedage}</td><td class="n">#${r.rangVurderinger}</td>
          <td class="n">${r.vurderingerRaw}</td>
        </tr>`).join('');
      // NYT (bruger-ønske 2026-08-18): den fulde rangeringstabel er kollapset
      // som standard — "Samlet placering"-kortet ovenfor giver allerede egen
      // kommunes tal, tabellen er kun for dem der vil sammenligne på tværs.
      el.innerHTML = summaryHtml
        + `<details class="kb-details">
             <summary>Se fuld rangering (${N} kommuner)</summary>
             <div class="kb-unit-note">Ligevægtet gennemsnit af rangene i de tre rapporter til højre — lavest samlet tal er bedst.</div>
             <table class="kstat-table"><thead><tr style="color:var(--ink-soft);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em">
               <td>Samlet</td><td>Kommune</td><td class="n">Varsler</td><td class="n">Lukkedage</td><td class="n">Indberetninger</td><td class="n">Total # indberetninger</td>
             </tr></thead><tbody>${rowsHtml}</tbody></table>
           </details>`
        + kbLavNHtml;
      return;
    }

    const REPORTS = {
      varsler:      ['Risikovarsler pr. badested i perioden — færrest indekseret = bedst placering.', 'varslerIndekseret', 'rangVarsler'],
      lukkedage:    ['Dage med mindst ét lukket/varslet badested, pr. badested i perioden — færrest indekseret = bedst placering.', 'lukkedageIndekseret', 'rangLukkedage'],
      vurderinger:  ['Indsendte borgerindberetninger pr. badested i perioden — flest indekseret = bedst placering (modsat retning af Varsler/Lukkedage).', 'vurderingerIndekseret', 'rangVurderinger'],
    };
    const [unitNote, key, rangKey] = REPORTS[report];
    el.innerHTML = kbRankTable(unitNote, data.hovedranking, key, rangKey, ownNavn);
  } catch (e) {
    el.innerHTML = '<div class="err">Kunne ikke hente kommune-benchmark — tjek din forbindelse.</div>';
  }
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('da-DK', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
}

// NYT (Kommunepakke, modul 6). ov-badesteder genbruger bevidst samme
// /admin/api/badested-history-endpoint som historik-kortet ovenfor —
// month-parameteren er ligegyldig her (vi bruger kun id/slug/navn), men en
// separat "bare-liste"-rute ville være en ren duplikering af
// tenantBadesteder.resolveTenantBadesteder()-opslaget, den rute allerede
// laver. Samme ejerskabs-tjek (server-side, i selve POST /admin/api/override)
// gælder uanset hvad denne liste indeholder — denne er kun til UI'ens skyld.
let ovBadesteder = [];
async function loadOverrideBadesteder() {
  const sel = document.getElementById('ov-badested');
  if (!sel) return;
  try {
    const resp = await fetch(`/admin/api/badested-history?month=${encodeURIComponent(currentMonthStr())}`, { cache: 'no-store' });
    const data = await resp.json();
    ovBadesteder = (resp.ok && data.badesteder) || [];
    sel.innerHTML = ovBadesteder.length
      ? ovBadesteder.map(b => `<option value="${escHtml(b.id)}">${escHtml(b.navn)}</option>`).join('')
      : '<option value="">Ingen badesteder fundet</option>';
  } catch (e) {
    sel.innerHTML = '<option value="">Kunne ikke hente badesteder</option>';
  }
}

async function submitOverride(e) {
  e.preventDefault();
  const resultEl = document.getElementById('ov-result');
  const badestedId = document.getElementById('ov-badested').value;
  const bucketSel = document.getElementById('ov-bucket');
  const bucket = bucketSel.value;
  const message = document.getElementById('ov-message').value.trim();
  const durationValue = Number(document.getElementById('ov-duration-value').value);
  const durationUnit = document.getElementById('ov-duration-unit').value;
  if (!badestedId || !message || !Number.isFinite(durationValue) || durationValue <= 0) {
    resultEl.innerHTML = '<div class="err">Udfyld alle felter — varighed skal være et positivt tal.</div>';
    return false;
  }
  const durationHours = durationUnit === 'days' ? durationValue * 24 : durationValue;
  const bucketLabel = bucketSel.selectedOptions[0].textContent;
  const navn = (ovBadesteder.find(b => String(b.id) === badestedId) || {}).navn || 'dette badested';
  if (!confirm(`Udsend kommunalt varsel ("${bucketLabel}") for ${navn}?\n\nBanneret på badestedets side + et push til abonnenter bliver ØJEBLIKKELIGT synligt, og gælder i ${durationValue} ${durationUnit === 'days' ? 'dage' : 'timer'}.\n\nDette ændrer IKKE badestedets officielle status eller risikoprocent — kun banneret.`)) {
    return false;
  }

  resultEl.textContent = 'Sender…';
  try {
    const resp = await fetch('/admin/api/override', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ badestedId, bucket, message, durationHours }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      resultEl.innerHTML = `<div class="err">${escHtml(data.error || 'Kunne ikke udsende kommunalt varsel.')}</div>`;
      return false;
    }
    resultEl.innerHTML = `<div class="ov-ok">✓ Banner sat og synligt med det samme — gælder til ${fmtDateTime(data.expiresAt)}.${data.pushSent ? ` ${data.pushSent} abonnent(er) varslet.` : ''} (Officiel status/risikoprocent er uændret.)</div>`;
    document.getElementById('ov-message').value = '';
    loadActiveOverrides();
    loadAlertStats();
  } catch (e) {
    resultEl.innerHTML = '<div class="err">Kunne ikke udsende kommunalt varsel — tjek din forbindelse.</div>';
  }
  return false;
}

async function loadActiveOverrides() {
  const el = document.getElementById('ov-active');
  if (!el) return;
  try {
    const resp = await fetch('/admin/api/overrides', { cache: 'no-store' });
    const data = await resp.json();
    if (!resp.ok || !data.overrides || data.overrides.length === 0) {
      el.innerHTML = '<div class="ov-none">Ingen aktive overstyringer lige nu.</div>';
      return;
    }
    el.innerHTML = data.overrides.map(o => {
      const navn = (ovBadesteder.find(b => String(b.id) === String(o.badested_id)) || {}).navn || o.badested_id;
      return `
        <div class="ov-active-row">
          <div><strong>${escHtml(navn)}</strong> — ${escHtml(o.bucket)}</div>
          <div class="ov-active-msg">${escHtml(o.message)}</div>
          <div class="ov-active-meta">Gælder til ${fmtDateTime(o.expires_at)}</div>
          <button type="button" onclick="clearOverride('${escHtml(o.badested_id)}')">Ryd nu</button>
        </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = '';
  }
}

async function clearOverride(badestedId) {
  if (!confirm('Ryd det kommunale varsel nu, før det naturligt udløber? Banneret fjernes øjeblikkeligt fra badestedets side.')) return;
  try {
    const resp = await fetch(`/admin/api/override/${encodeURIComponent(badestedId)}/clear`, { method: 'POST' });
    if (resp.ok) loadActiveOverrides();
  } catch (e) { /* ingen synlig fejlhåndtering nødvendig — "Ryd nu" kan blot forsøges igen */ }
}

async function logout() {
  await fetch('/admin/logout', { method: 'POST' });
  location.reload();
}

render();
</script>
